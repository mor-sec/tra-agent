[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tra-agent"
version = "0.5.0"
description = "Threat and risk assessment (TRA) agent: platform-neutral core and AgentCore/Foundry adapters"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
aws = ["boto3>=1.35"]
azure = ["openai>=1.50", "azure-identity>=1.17"]
confluence = ["httpx>=0.27"]
# Shared by both platform adapters (tra_platform).
platform = [
    "mcp>=2.0",
    "a2a-sdk[http-server]>=1.2,<2",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "uvicorn>=0.30",
]
agentcore = ["tra-agent[platform,aws]", "bedrock-agentcore>=1.24"]
foundry = [
    "tra-agent[platform,azure,aws]",
    "azure-ai-agentserver-invocations>=1.2",
    "azure-storage-blob>=12.20",
]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "tra-agent[agentcore,foundry]"]

[project.scripts]
tra-agent = "tra_core.cli:main"
tra-eval = "tra_eval.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tra_core = ["data/*.yaml", "agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["infra/aws/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: the formatter owns line length. UP042: StrEnum changes str() of members.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]
