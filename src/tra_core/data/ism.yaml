# Generated by scripts/refresh_frameworks.py from the published source. Do not edit by hand.
framework: ASD Information Security Manual
version: 2026.09.4
baseline: 'OFFICIAL: Sensitive'
controls:
  ISM-0009:
    guideline: System owners
    section: Protecting systems and their resources
    statement: System owners, in consultation with each system’s authorising officer, identify any supplementary security
      controls required based upon the unique nature of each system, its operating environment and the organisation’s risk
      tolerances.
  ISM-0027:
    guideline: System owners
    section: Protecting systems and their resources
    statement: 'System owners obtain an authorisation to operate for each non-classified, OFFICIAL: Sensitive, PROTECTED and
      SECRET system from its authorising officer.'
  ISM-0039:
    guideline: Development and maintenance of cyber security documentation
    section: Cyber security strategy
    statement: A cyber security strategy is developed, implemented and maintained.
  ISM-0041:
    guideline: System-specific cyber security documentation
    section: System security plan
    statement: Systems have a system security plan that includes an overview of the system (covering the system’s purpose,
      the system boundary and how the system is managed) as well as an annex that covers applicable security controls from
      this document and any additional security controls that have been identified and implemented.
  ISM-0042:
    guideline: System administration
    section: System administration processes and procedures
    statement: System administration processes, and supporting system administration procedures, are developed, implemented
      and maintained.
  ISM-0043:
    guideline: System-specific cyber security documentation
    section: Cyber security incident response plan
    statement: 'Systems have a cyber security incident response plan that covers the following:


      - guidelines on what constitutes a cyber security incident

      - the types of cyber security incidents likely to be encountered and the expected response to each type

      - how to report cyber security incidents, internally to an organisation and externally to relevant authorities

      - other parties that need to be informed in the event of a cyber security incident

      - the authority, or authorities, responsible for investigating and responding to cyber security incidents

      - the criteria by which an investigation of a cyber security incident would be requested from a law enforcement agency,
      the Australian Signals Directorate or other relevant authority

      - the steps necessary to ensure the integrity of evidence relating to a cyber security incident

      - system contingency measures or a reference to such details if they are in a separate document.'
  ISM-0047:
    guideline: Development and maintenance of cyber security documentation
    section: Approval of cyber security documentation
    statement: Organisational-level cyber security documentation is approved by the chief information security officer while
      system-specific cyber security documentation is approved by the system’s authorising officer.
  ISM-0072:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: Security requirements associated with the confidentiality, integrity and availability of data are documented
      in contractual arrangements with service providers and regularly reviewed to ensure they remain fit for purpose.
  ISM-0100:
    guideline: Gateways
    section: Assessment of gateways
    statement: 'Non-classified, OFFICIAL: Sensitive, PROTECTED and SECRET gateways undergo an IRAP assessment, using the latest
      release of the ISM available prior to the beginning of the IRAP assessment (or a subsequent release), at least every
      24 months.'
  ISM-0109:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Event logs from workstations are analysed in a timely manner to detect cyber security events.
    essential_eight:
    - ML3
  ISM-0120:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Cyber security personnel have access to sufficient tools to facilitate the detection of cyber security events
      and the identification of cyber security incidents.
  ISM-0123:
    guideline: Managing cyber security incidents
    section: Reporting cyber security incidents
    statement: Cyber security incidents are reported to the chief information security officer, or one of their delegates,
      as soon as possible after they occur or are discovered.
    essential_eight:
    - ML2
    - ML3
  ISM-0125:
    guideline: Managing cyber security incidents
    section: Cyber security incident register
    statement: A cyber security incident register is developed, implemented and maintained.
  ISM-0133:
    guideline: Responding to cyber security incidents
    section: Handling and containing data spills
    statement: When a data spill occurs, data owners are advised and access to the data is restricted.
  ISM-0137:
    guideline: Responding to cyber security incidents
    section: Handling and containing intrusions
    statement: Legal advice is sought before allowing intrusion activity to continue on a system for the purpose of collecting
      further data or evidence.
  ISM-0138:
    guideline: Responding to cyber security incidents
    section: Maintaining the integrity of evidence
    statement: 'The integrity of evidence gathered during an investigation is maintained by investigators:


      - recording all their actions

      - maintaining a proper chain of custody

      - following all instructions provided by relevant law enforcement agencies.'
  ISM-0140:
    guideline: Managing cyber security incidents
    section: Reporting cyber security incidents to ASD
    statement: Cyber security incidents are reported to ASD as soon as possible after they occur or are discovered.
    essential_eight:
    - ML2
    - ML3
  ISM-0141:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: The requirement for service providers to report cyber security incidents to a designated point of contact as
      soon as possible after they occur or are discovered is documented in contractual arrangements with service providers.
  ISM-0142:
    guideline: Cryptographic fundamentals
    section: Reporting cryptographic-related cyber security incidents
    statement: The compromise or suspected compromise of cryptographic equipment or associated keying material is reported
      to the chief information security officer, or one of their delegates, as soon as possible after it occurs.
  ISM-0161:
    guideline: IT equipment and media
    section: Securing IT equipment and media
    statement: IT equipment and media are secured when not in use.
  ISM-0164:
    guideline: Facilities and systems
    section: Preventing observation by unauthorised people
    statement: Unauthorised people are prevented from observing systems, in particular workstation displays and keyboards,
      within facilities.
  ISM-0181:
    guideline: Cabling infrastructure
    section: Cabling infrastructure standards
    statement: Cabling infrastructure is installed in accordance with relevant Australian Standards, as directed by the Australian
      Communications and Media Authority.
  ISM-0206:
    guideline: Cabling infrastructure
    section: Cable labelling processes and procedures
    statement: Cable labelling processes, and supporting cable labelling procedures, are developed, implemented and maintained.
  ISM-0208:
    guideline: Cabling infrastructure
    section: Cable register
    statement: 'A cable register contains the following for each cable:


      - cable identifier

      - cable colour

      - sensitivity/classification

      - source

      - destination

      - location

      - seal numbers (if applicable).'
  ISM-0211:
    guideline: Cabling infrastructure
    section: Cable register
    statement: A cable register is developed, implemented, maintained and regularly verified.
  ISM-0229:
    guideline: Telephone systems
    section: Personnel awareness
    statement: Personnel are advised of the permitted sensitivity or classification of information that can be discussed over
      internal and external telephone systems.
  ISM-0230:
    guideline: Telephone systems
    section: Personnel awareness
    statement: Personnel are advised of security risks posed by non-secure telephone systems in areas where sensitive or classified
      conversations can occur.
  ISM-0231:
    guideline: Telephone systems
    section: Personnel awareness
    statement: When using cryptographic equipment to permit different levels of conversation for different kinds of connections,
      telephone systems give a visual indication of what kind of connection has been made.
  ISM-0232:
    guideline: Telephone systems
    section: Protecting conversations
    statement: Telephone systems used for sensitive or classified conversations encrypt all traffic that passes over external
      systems.
  ISM-0233:
    guideline: Telephone systems
    section: Cordless telephone systems
    statement: Cordless telephone handsets and headsets are not used for sensitive or classified conversations unless all
      communications are encrypted using ASD-approved cryptography.
  ISM-0235:
    guideline: Telephone systems
    section: Speakerphones
    statement: Speakerphones are not used on telephone systems in TOP SECRET areas unless the telephone system is located
      in an audio secure room, the room is audio secure during conversations and only personnel involved in conversations
      are present in the room.
  ISM-0236:
    guideline: Telephone systems
    section: Off-hook audio protection
    statement: Off-hook audio protection features are used on telephone systems in areas where background conversations may
      exceed the sensitivity or classification that the telephone system is authorised for communicating.
  ISM-0240:
    guideline: Mobile device usage
    section: Using paging, message services and messaging apps
    statement: Paging, Multimedia Message Service, Short Message Service and messaging apps are not used to communicate sensitive
      or classified data.
  ISM-0245:
    guideline: Multifunction devices
    section: Connecting multifunction devices to digital telephone systems
    statement: MFDs are not connected to digital telephone systems.
  ISM-0250:
    guideline: Emanation security
    section: Electromagnetic interference/electromagnetic compatibility standards
    statement: IT equipment meets industry and government standards relating to electromagnetic interference/electromagnetic
      compatibility.
  ISM-0252:
    guideline: Cyber security awareness training
    section: Providing cyber security awareness training
    statement: 'Cyber security awareness training is undertaken annually by all personnel and covers:


      - the purpose of the cyber security awareness training

      - security appointments and contacts

      - authorised use of systems and their resources

      - protection of systems and their resources

      - reporting of cyber security incidents and suspected compromises of systems and their resources.'
  ISM-0258:
    guideline: Cyber security awareness training
    section: Web usage policy
    statement: A web usage policy is developed, implemented and maintained.
  ISM-0260:
    guideline: Web proxies
    section: Using web proxies
    statement: All web access, including that by internal servers, is conducted through web proxies.
  ISM-0261:
    guideline: Web proxies
    section: Web proxy event logging
    statement: 'The following details are centrally logged for websites accessed via web proxies:


      - web address

      - date and time

      - user

      - amount of data uploaded and downloaded

      - internal and external IP addresses.'
  ISM-0263:
    guideline: Web content filters
    section: Transport Layer Security filtering
    statement: TLS traffic communicated through gateways is decrypted and inspected.
  ISM-0264:
    guideline: Email usage
    section: Email usage policy
    statement: An email usage policy is developed, implemented and maintained.
  ISM-0267:
    guideline: Email usage
    section: Webmail services
    statement: Access to non-approved webmail services is blocked.
  ISM-0270:
    guideline: Email usage
    section: Protective markings for emails
    statement: Protective markings are applied to emails and reflect the highest sensitivity or classification of the subject,
      body and attachments.
  ISM-0271:
    guideline: Email usage
    section: Protective marking tools
    statement: Protective marking tools do not automatically insert protective markings into emails.
  ISM-0272:
    guideline: Email usage
    section: Protective marking tools
    statement: Protective marking tools do not allow the selection of protective markings that a system has not been authorised
      to process, store or communicate.
  ISM-0280:
    guideline: Evaluated product procurement
    section: Evaluated product selection
    statement: If procuring an evaluated product, a product that has completed a PP-based evaluation, including against all
      applicable PP modules (as well as a software bill of materials assessment if applicable), is selected in preference
      to one that has completed an EAL-based evaluation.
  ISM-0285:
    guideline: Evaluated product procurement
    section: Delivery of evaluated products
    statement: Evaluated products are delivered in a manner consistent with any delivery procedures defined in associated
      evaluation documentation.
  ISM-0289:
    guideline: Evaluated product usage
    section: Using evaluated products
    statement: Evaluated products are installed, configured, administered and operated in an evaluated configuration and in
      accordance with vendor guidance.
  ISM-0293:
    guideline: IT equipment usage
    section: Classifying IT equipment
    statement: IT equipment is classified based on the highest sensitivity or classification of data that it is approved for
      processing, storing or communicating.
  ISM-0294:
    guideline: IT equipment usage
    section: Labelling IT equipment
    statement: IT equipment, except for high assurance IT equipment, is labelled with protective markings reflecting its sensitivity
      or classification.
  ISM-0298:
    guideline: System maintenance
    section: Patch management processes and procedures
    statement: A centralised and managed approach that maintains the integrity of patches or updates, and confirms that they
      have been applied successfully, is used to patch or update applications, operating systems, drivers and firmware.
  ISM-0304:
    guideline: System maintenance
    section: Cessation of support
    statement: Applications other than office productivity suites, web browsers and their extensions, email clients, PDF applications,
      Adobe Flash Player, and security products that are no longer supported by vendors are removed.
    essential_eight:
    - ML3
  ISM-0305:
    guideline: IT equipment maintenance or repairs
    section: On-site maintenance or repairs
    statement: Maintenance or repairs of IT equipment are carried out on site by an appropriately cleared technician.
  ISM-0306:
    guideline: IT equipment maintenance or repairs
    section: On-site maintenance or repairs
    statement: 'If an appropriately cleared technician is not used to undertake maintenance or repairs to IT equipment, the
      technician is escorted by someone who:


      - has the authority to direct the technician

      - is appropriately cleared and briefed

      - is sufficiently familiar with the IT equipment to understand the work being undertaken

      - takes all responsible measures to ensure the integrity of the IT equipment

      - takes due care to ensure that data is not disclosed.'
  ISM-0307:
    guideline: IT equipment maintenance or repairs
    section: On-site maintenance or repairs
    statement: If an appropriately cleared technician is not used to undertake maintenance or repairs to IT equipment, the
      IT equipment and associated media are sanitised before maintenance or repairs.
  ISM-0310:
    guideline: IT equipment maintenance or repairs
    section: Off-site maintenance or repairs
    statement: IT equipment maintained or repaired off site is handled at facilities approved for handling the sensitivity
      or classification of the IT equipment.
  ISM-0311:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising IT equipment
    statement: IT equipment containing media is sanitised by removing the media from the IT equipment or by sanitising the
      media in situ.
  ISM-0313:
    guideline: IT equipment sanitisation and destruction
    section: IT equipment sanitisation processes and procedures
    statement: IT equipment sanitisation processes, and supporting IT equipment sanitisation procedures, are developed, implemented
      and maintained.
  ISM-0316:
    guideline: IT equipment disposal
    section: Disposal of IT equipment
    statement: Following sanitisation, destruction or declassification, a formal administrative decision is made to release
      IT equipment, or its waste, into the public domain.
  ISM-0317:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising printers and multifunction devices
    statement: At least three pages of random text with no blank areas are printed on each colour printer cartridge or MFD
      print drum.
  ISM-0318:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising printers and multifunction devices
    statement: When unable to sanitise printer cartridges or MFD print drums, they are destroyed as per electrostatic memory
      devices.
  ISM-0323:
    guideline: Media usage
    section: Classifying media
    statement: Media is classified to the highest sensitivity or classification of data it stores, unless the media has been
      classified to a higher sensitivity or classification.
  ISM-0325:
    guideline: Media usage
    section: Reclassifying media
    statement: Any media connected to a system with a higher sensitivity or classification than the media is reclassified
      to the higher sensitivity or classification, unless the media is read-only or the system has a mechanism through which
      read-only access can be ensured.
  ISM-0330:
    guideline: Media usage
    section: Reclassifying media
    statement: Before reclassifying media to a lower sensitivity or classification, the media is sanitised or destroyed, and
      a formal administrative decision is made to reclassify it.
  ISM-0332:
    guideline: Media usage
    section: Labelling media
    statement: Media, except for internally mounted fixed media within information technology equipment, is labelled with
      protective markings reflecting its sensitivity or classification.
  ISM-0336:
    guideline: IT equipment usage
    section: IT equipment registers
    statement: A networked IT equipment register is developed, implemented, maintained and regularly verified.
  ISM-0337:
    guideline: Media usage
    section: Classifying media
    statement: Media is only used with systems that are authorised to process, store or communicate its sensitivity or classification.
  ISM-0341:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Automatic execution features for removable media are disabled.
  ISM-0343:
    guideline: Operating system hardening
    section: Device access control
    statement: If there is no business requirement for writing to removable media and devices, such functionality is disabled
      via the use of a device access control application or by disabling external communication interfaces.
  ISM-0345:
    guideline: Operating system hardening
    section: Device access control
    statement: External communication interfaces that allow DMA are disabled.
  ISM-0347:
    guideline: Media usage
    section: Using media for data transfers
    statement: When transferring data manually between two systems belonging to different security domains, write-once media
      is used unless the destination system has a mechanism through which read-only access can be ensured.
  ISM-0348:
    guideline: Media sanitisation
    section: Media sanitisation processes and procedures
    statement: Media sanitisation processes, and supporting media sanitisation procedures, are developed, implemented and
      maintained.
  ISM-0350:
    guideline: Media destruction
    section: Media that cannot be sanitised
    statement: 'The following media types are destroyed prior to their disposal:


      - microfiche and microfilm

      - optical discs

      - programmable read-only memory

      - read-only memory

      - other types of media that cannot be sanitised.'
  ISM-0351:
    guideline: Media sanitisation
    section: Volatile media sanitisation
    statement: Volatile media is sanitised by removing its power for at least 10 minutes.
  ISM-0354:
    guideline: Media sanitisation
    section: Non-volatile magnetic media sanitisation
    statement: Non-volatile magnetic media is sanitised by overwriting it at least once (or three times if pre-2001 or under
      15 GB) in its entirety with a random pattern followed by a read back for verification.
  ISM-0357:
    guideline: Media sanitisation
    section: Non-volatile erasable programmable read-only memory media sanitisation
    statement: Non-volatile EPROM media is sanitised by applying three times the manufacturer’s specified ultraviolet erasure
      time and then overwriting it at least once in its entirety with a random pattern followed by a read back for verification.
  ISM-0359:
    guideline: Media sanitisation
    section: Non-volatile flash memory media sanitisation
    statement: Non-volatile flash memory media is sanitised by overwriting it at least twice in its entirety with a random
      pattern followed by a read back for verification.
  ISM-0361:
    guideline: Media destruction
    section: Degaussing magnetic media
    statement: Magnetic media is destroyed using a degausser with a suitable magnetic field strength and magnetic orientation.
  ISM-0362:
    guideline: Media destruction
    section: Degaussing magnetic media
    statement: Product-specific directions provided by degausser manufacturers are followed.
  ISM-0363:
    guideline: Media destruction
    section: Media destruction processes and procedures
    statement: Media destruction processes, and supporting media destruction procedures, are developed, implemented and maintained.
  ISM-0368:
    guideline: Media destruction
    section: Media destruction methods
    statement: Media destroyed using a hammer mill, disintegrator, grinder/sander or by cutting results in media waste particles
      no larger than 9 mm.
  ISM-0370:
    guideline: Media destruction
    section: Supervision of destruction
    statement: The destruction of media is performed under the supervision of at least one cleared person.
  ISM-0371:
    guideline: Media destruction
    section: Supervision of destruction
    statement: Personnel supervising the destruction of media supervise its handling to the point of destruction and ensure
      that the destruction is completed successfully.
  ISM-0372:
    guideline: Media destruction
    section: Supervision of accountable material destruction
    statement: The destruction of media storing accountable material is performed under the supervision of at least two cleared
      personnel.
  ISM-0373:
    guideline: Media destruction
    section: Supervision of accountable material destruction
    statement: Personnel supervising the destruction of media storing accountable material supervise its handling to the point
      of destruction, ensure that the destruction is completed successfully and sign a destruction certificate afterwards.
  ISM-0374:
    guideline: Media disposal
    section: Media disposal processes and procedures
    statement: Media disposal processes, and supporting media disposal procedures, are developed, implemented and maintained.
  ISM-0375:
    guideline: Media disposal
    section: Disposal of media
    statement: Following sanitisation, destruction or declassification, a formal administrative decision is made to release
      media, or its waste, into the public domain.
  ISM-0378:
    guideline: Media disposal
    section: Disposal of media
    statement: Labels and markings indicating the owner, sensitivity, classification or any other marking that can associate
      media with its prior use are removed prior to its disposal.
  ISM-0380:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Unneeded user accounts, components, services and functionality of operating systems are disabled or removed.
  ISM-0382:
    guideline: Operating system hardening
    section: Application management
    statement: Unprivileged human users do not have the ability to uninstall or disable approved applications.
  ISM-0383:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Default user accounts or credentials for operating systems, including for any pre-configured user accounts,
      are changed, disabled or removed during initial setup.
  ISM-0385:
    guideline: Network design and configuration
    section: Functional separation between servers
    statement: Servers maintain effective functional separation from each other.
  ISM-0393:
    guideline: Databases
    section: Protecting database contents
    statement: Databases and their contents are classified based on the sensitivity or classification of data that they contain.
  ISM-0400:
    guideline: Software development fundamentals
    section: Development, testing, staging and production environments
    statement: Development, testing, staging and production environments are segregated.
  ISM-0401:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Secure by Design principles and practices are followed throughout the software development life cycle.
  ISM-0402:
    guideline: Software development fundamentals
    section: Software security testing
    statement: Software is comprehensively tested for vulnerabilities using SAST, DAST and SCA prior to its initial release,
      any subsequent release, and periodically to help identify any previously unidentified vulnerabilities.
  ISM-0405:
    guideline: Identity and access management
    section: Unprivileged access to systems
    statement: Requests for unprivileged access to systems and their resources are validated when first requested.
  ISM-0407:
    guideline: Identity and access management
    section: Recording authorisation for personnel to access systems
    statement: 'A secure record is maintained for the life of systems and their resources that covers the following for each
      human user:


      - their unique identifier

      - their signed agreement to abide by system usage policies

      - who authorised their access

      - when their access was granted

      - the level of access they were granted

      - when their access, and their level of access, was last reviewed

      - when their level of access was changed, and to what extent (if applicable)

      - when their access was withdrawn (if applicable).'
  ISM-0408:
    guideline: Identity and access management
    section: System access requirements
    statement: Systems have a logon banner that reminds personnel of their security responsibilities when accessing the system
      and its resources.
  ISM-0414:
    guideline: Identity and access management
    section: User identification
    statement: Users granted access to systems and their resources are uniquely identifiable.
  ISM-0415:
    guideline: Identity and access management
    section: User identification
    statement: The use of shared user accounts is strictly controlled, and users of such accounts are uniquely identifiable.
  ISM-0417:
    guideline: Identity and access management
    section: Single-factor authentication
    statement: When systems cannot support multi-factor authentication, single-factor authentication using passwords is implemented
      instead.
  ISM-0418:
    guideline: Credential management
    section: Protecting credentials
    statement: Physical credentials are kept separate from systems they are used to authenticate to, except for when performing
      authentication activities.
  ISM-0421:
    guideline: Credential management
    section: Password strength
    statement: 'Passwords used for single-factor authentication on non-classified, OFFICIAL: Sensitive and PROTECTED systems
      are a minimum of 15 characters.'
  ISM-0428:
    guideline: Identity and access management
    section: Session locking
    statement: 'Services are configured with a session lock that:


      - activates after a maximum of 15 minutes of human user inactivity, a maximum of 12 hours of overall session time or
      when manually activated

      - blocks access to all session content

      - requires re-authentication by human users using all authentication factors to unlock the session

      - denies human users the ability to disable the session locking mechanism.'
  ISM-0430:
    guideline: Identity and access management
    section: Suspension of access to systems
    statement: Access to systems and their resources are removed or suspended the same day users no longer have a legitimate
      requirement for access.
  ISM-0432:
    guideline: Identity and access management
    section: System access requirements
    statement: Access requirements for systems and their resources are documented in their system security plan.
  ISM-0434:
    guideline: Identity and access management
    section: System access requirements
    statement: Personnel undergo appropriate employment screening and, where necessary, hold an appropriate security clearance
      before being granted access to systems and their resources.
  ISM-0435:
    guideline: Identity and access management
    section: System access requirements
    statement: Personnel receive any necessary briefings before being granted access to systems and their resources.
  ISM-0441:
    guideline: Identity and access management
    section: Temporary access to systems
    statement: When personnel are granted temporary access to systems and their resources, effective security controls are
      put in place to restrict their access to only data required for them to undertake their duties or functions.
  ISM-0445:
    guideline: Identity and access management
    section: Privileged access to systems
    statement: Privileged human users are assigned a dedicated privileged user account to be used solely for duties requiring
      privileged access.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-0455:
    guideline: Cryptographic fundamentals
    section: Data recovery
    statement: Where practical, cryptographic equipment, applications and libraries provide a means of data recovery to allow
      for circumstances where the encryption key is unavailable due to loss, damage or failure.
  ISM-0457:
    guideline: Cryptographic fundamentals
    section: Cryptographic implementation assurance
    statement: 'Cryptographic equipment, applications or libraries that have completed a Common Criteria evaluation against
      an ASD-endorsed Protection Profile are used when encrypting media that contains OFFICIAL: Sensitive or PROTECTED data.'
  ISM-0459:
    guideline: Media usage
    section: Encrypting media
    statement: Full disk encryption, or partial encryption where access controls only allow writing to encrypted partitions
      or volumes, is implemented when encrypting media.
  ISM-0462:
    guideline: Cryptographic fundamentals
    section: Handling encrypted IT equipment and media
    statement: When a user authenticates to the encryption functionality of IT equipment or media, it is treated in accordance
      with its original sensitivity or classification until the user deauthenticates from the encryption functionality.
  ISM-0465:
    guideline: Cryptographic fundamentals
    section: Cryptographic implementation assurance
    statement: 'Cryptographic equipment, applications or libraries that have completed a Common Criteria evaluation against
      an ASD-endorsed Protection Profile are used to protect OFFICIAL: Sensitive or PROTECTED data when communicated over
      insufficiently secure networks, outside of appropriately secure areas or via public network infrastructure.'
  ISM-0469:
    guideline: Cryptographic protocols
    section: Using cryptographic protocols
    statement: An AACP or high assurance cryptographic protocol is used when encrypting data in transit.
  ISM-0471:
    guideline: Cryptographic algorithms
    section: Using cryptographic algorithms
    statement: Only AACAs or high assurance cryptographic algorithms are used by cryptographic equipment, applications and
      libraries.
  ISM-0472:
    guideline: Cryptographic algorithms
    section: Using Diffie-Hellman
    statement: When using DH for agreeing on encryption session keys, a modulus of at least 2048 bits is used, preferably
      3072 bits.
  ISM-0474:
    guideline: Cryptographic algorithms
    section: Using Elliptic Curve Diffie-Hellman
    statement: When using ECDH for agreeing on encryption session keys, a base point order and key size of at least 224 bits
      is used, preferably the NIST P-384 curve.
  ISM-0475:
    guideline: Cryptographic algorithms
    section: Using the Elliptic Curve Digital Signature Algorithm
    statement: When using ECDSA for digital signatures, a base point order and key size of at least 224 bits is used, preferably
      the P-384 curve.
  ISM-0476:
    guideline: Cryptographic algorithms
    section: Using Rivest-Shamir-Adleman
    statement: When using RSA for digital signatures, and transporting encryption session keys (and similar keys), a modulus
      of at least 2048 bits is used, preferably 3072 bits.
  ISM-0477:
    guideline: Cryptographic algorithms
    section: Using Rivest-Shamir-Adleman
    statement: When using RSA for digital signatures, and for transporting encryption session keys (and similar keys), a different
      key pair is used for digital signatures and transporting encryption session keys.
  ISM-0479:
    guideline: Cryptographic algorithms
    section: Using symmetric cryptographic algorithms
    statement: Symmetric cryptographic algorithms are not used in Electronic Codebook Mode.
  ISM-0481:
    guideline: Cryptographic protocols
    section: Using cryptographic protocols
    statement: Only AACPs or high assurance cryptographic protocols are used by cryptographic equipment, applications and
      libraries.
  ISM-0484:
    guideline: Secure Shell
    section: Configuring Secure Shell
    statement: 'The SSH daemon is configured to:


      - only listen on the required interfaces (ListenAddress xxx.xxx.xxx.xxx)

      - have a suitable login banner (Banner x)

      - have a login authentication timeout of no more than 60 seconds (LoginGraceTime 60)

      - disable host-based authentication (HostbasedAuthentication no)

      - disable rhosts-based authentication (IgnoreRhosts yes)

      - disable the ability to log in directly as root (PermitRootLogin no)

      - disable empty passwords (PermitEmptyPasswords no)

      - disable connection forwarding (AllowTCPForwarding no)

      - disable gateway ports (GatewayPorts no)

      - disable X11 forwarding (X11Forwarding no).'
  ISM-0485:
    guideline: Secure Shell
    section: Authentication mechanisms
    statement: Public key-based authentication is used for SSH connections.
  ISM-0487:
    guideline: Secure Shell
    section: Automated remote access
    statement: 'When using logins without a password for SSH connections, the following are disabled:


      - access from IP addresses that do not require access

      - port forwarding

      - agent credential forwarding

      - X11 forwarding

      - console access.'
  ISM-0488:
    guideline: Secure Shell
    section: Automated remote access
    statement: If using remote access without the use of a password for SSH connections, the ‘forced command’ option is used
      to specify what command is executed and parameter checking is enabled.
  ISM-0489:
    guideline: Secure Shell
    section: SSH-agent
    statement: When SSH-agent or similar key caching applications are used, cached private keys have a maximum lifetime of
      four hours and, where applicable, screen locks are used on workstations and servers.
  ISM-0490:
    guideline: Secure/Multipurpose Internet Mail Extensions
    section: Configuring Secure/Multipurpose Internet Mail Extensions
    statement: Versions of S/MIME earlier than S/MIME version 3.0 are not used for S/MIME connections.
  ISM-0494:
    guideline: Internet Protocol Security
    section: Mode of operation
    statement: Tunnel mode is used for IPsec connections; however, if using transport mode, an IP tunnel is used.
  ISM-0496:
    guideline: Internet Protocol Security
    section: Protocol selection
    statement: The ESP protocol is used for authentication and encryption of IPsec connections.
  ISM-0498:
    guideline: Internet Protocol Security
    section: Security association lifetimes
    statement: A security association lifetime of less than four hours (14400 seconds) is used for IPsec connections.
  ISM-0501:
    guideline: Cryptographic fundamentals
    section: Transporting cryptographic equipment
    statement: Keyed cryptographic equipment is transported based on the sensitivity or classification of its keying material.
  ISM-0507:
    guideline: Cryptographic fundamentals
    section: Cryptographic key management processes and procedures
    statement: Cryptographic key management processes, and supporting cryptographic key management procedures, are developed,
      implemented and maintained.
  ISM-0516:
    guideline: Network design and configuration
    section: Network documentation
    statement: Network documentation includes high-level network diagrams showing all connections into networks and logical
      network diagrams showing all critical servers, high-value servers, network devices and network security appliances.
  ISM-0518:
    guideline: Network design and configuration
    section: Network documentation
    statement: Network documentation is developed, implemented and maintained.
  ISM-0520:
    guideline: Network design and configuration
    section: Network access controls
    statement: Network access controls are implemented on networks to prevent the connection of unauthorised network devices
      and networked IT equipment.
  ISM-0529:
    guideline: Network design and configuration
    section: Using virtual local area networks
    statement: VLANs are not used to separate network traffic between networks belonging to different security domains.
  ISM-0530:
    guideline: Network design and configuration
    section: Using virtual local area networks
    statement: Network devices managing VLANs are administered from the most trusted security domain.
  ISM-0534:
    guideline: Network design and configuration
    section: Disabling unused physical ports on network devices
    statement: Unused physical ports on network devices are disabled.
  ISM-0535:
    guideline: Network design and configuration
    section: Using virtual local area networks
    statement: Network devices managing VLANs belonging to different security domains do not share VLAN trunks.
  ISM-0536:
    guideline: Wireless networks
    section: Public wireless networks
    statement: Public wireless networks provided for public use are segregated from all other organisation networks.
  ISM-0546:
    guideline: Video conferencing and Internet Protocol telephony
    section: Video-aware and voice-aware firewalls and proxies
    statement: When video conferencing or IP telephony traffic passes through a gateway containing a firewall or proxy, a
      video-aware or voice-aware firewall or proxy is used.
  ISM-0547:
    guideline: Video conferencing and Internet Protocol telephony
    section: Protecting video conferencing and Internet Protocol telephony traffic
    statement: Video conferencing and IP telephony calls are conducted using a secure real-time transport protocol.
  ISM-0548:
    guideline: Video conferencing and Internet Protocol telephony
    section: Protecting video conferencing and Internet Protocol telephony traffic
    statement: Video conferencing and IP telephony calls are established using a secure session initiation protocol.
  ISM-0549:
    guideline: Video conferencing and Internet Protocol telephony
    section: Traffic separation
    statement: Video conferencing and IP telephony traffic is physically or logically separated from other data traffic.
  ISM-0551:
    guideline: Video conferencing and Internet Protocol telephony
    section: Video conferencing unit and Internet Protocol phone authentication
    statement: 'IP telephony is configured such that:


      - IP phones authenticate themselves to the call controller upon registration

      - auto-registration is disabled and only authorised devices are allowed to access the network

      - unauthorised devices are blocked by default

      - all unused and prohibited functionality is disabled.'
  ISM-0553:
    guideline: Video conferencing and Internet Protocol telephony
    section: Video conferencing unit and Internet Protocol phone authentication
    statement: Authentication and authorisation is used for all actions on a video conferencing network, including call setup
      and changing settings.
  ISM-0554:
    guideline: Video conferencing and Internet Protocol telephony
    section: Video conferencing unit and Internet Protocol phone authentication
    statement: An encrypted and non-replayable two-way authentication scheme is used for call authentication and authorisation.
  ISM-0555:
    guideline: Video conferencing and Internet Protocol telephony
    section: Video conferencing unit and Internet Protocol phone authentication
    statement: Authentication and authorisation is used for all actions on an IP telephony network, including registering
      a new IP phone, changing phone users, changing settings and accessing voicemail.
  ISM-0556:
    guideline: Video conferencing and Internet Protocol telephony
    section: Traffic separation
    statement: Workstations are not connected to video conferencing units or IP phones unless the workstation or the device
      uses virtual local area networks or similar mechanisms to maintain separation between video conferencing, IP telephony
      and other data traffic.
  ISM-0558:
    guideline: Video conferencing and Internet Protocol telephony
    section: Internet Protocol phones in public areas
    statement: IP phones used in public areas do not have the ability to access data networks, voicemail and directory services.
  ISM-0559:
    guideline: Video conferencing and Internet Protocol telephony
    section: Microphones and webcams
    statement: Microphones (including headsets and USB handsets) and webcams are not used with non-SECRET workstations in
      SECRET areas.
  ISM-0565:
    guideline: Email usage
    section: Handling emails with inappropriate, invalid or missing protective markings
    statement: Email servers are configured to block, log and report emails with inappropriate protective markings.
  ISM-0567:
    guideline: Email gateways and servers
    section: Open relay email servers
    statement: Email servers only relay emails destined for or originating from their domains (including subdomains).
  ISM-0569:
    guideline: Email gateways and servers
    section: Centralised email gateways
    statement: Emails are routed via centralised email gateways.
  ISM-0570:
    guideline: Email gateways and servers
    section: Email gateway maintenance activities
    statement: Where backup or alternative email gateways are in place, they are maintained at the same standard as the primary
      email gateway.
  ISM-0571:
    guideline: Email gateways and servers
    section: Centralised email gateways
    statement: When users send or receive emails, an authenticated and encrypted channel is used to route emails via their
      organisation’s centralised email gateways.
  ISM-0572:
    guideline: Email gateways and servers
    section: Email server transport encryption
    statement: Opportunistic TLS encryption is enabled on email servers that make incoming or outgoing email connections over
      public network infrastructure.
  ISM-0574:
    guideline: Email gateways and servers
    section: Sender Policy Framework
    statement: SPF is used to specify authorised email servers (or lack thereof) for an organisation’s domains (including
      subdomains).
  ISM-0576:
    guideline: Managing cyber security incidents
    section: Cyber security incident management policy
    statement: A cyber security incident management policy, and associated cyber security incident response plan, is developed,
      implemented and maintained.
  ISM-0580:
    guideline: Security monitoring
    section: Security monitoring policy
    statement: A security monitoring policy is developed, implemented and maintained.
  ISM-0582:
    guideline: Operating system hardening
    section: Operating system event logging
    statement: Security-relevant events for Microsoft Windows operating systems are centrally logged.
  ISM-0585:
    guideline: Security monitoring
    section: Event log details
    statement: For each event logged, the date and time of the event, the relevant user or process, the relevant filename,
      the event description, and the information technology equipment involved are captured.
  ISM-0588:
    guideline: Multifunction devices
    section: Multifunction device usage policy
    statement: An MFD usage policy is developed, implemented and maintained.
  ISM-0589:
    guideline: Multifunction devices
    section: Scanning and copying documents on multifunction devices
    statement: MFDs are not used to scan or copy documents above the sensitivity or classification of networks they are connected
      to.
  ISM-0590:
    guideline: Multifunction devices
    section: Authenticating to multifunction devices
    statement: Authentication measures for MFDs are the same strength as those used for workstations on networks they are
      connected to.
  ISM-0591:
    guideline: Peripheral switches
    section: Using peripheral switches
    statement: Evaluated peripheral switches are used when sharing peripherals between systems.
  ISM-0611:
    guideline: Gateways
    section: System administrators for gateways
    statement: System administrators for gateways are assigned the minimum privileges required to perform their duties.
  ISM-0612:
    guideline: Gateways
    section: System administrators for gateways
    statement: System administrators for gateways are formally trained on the operation and management of gateways.
  ISM-0616:
    guideline: Gateways
    section: System administrators for gateways
    statement: Separation of duties is implemented in performing administrative activities for gateways.
  ISM-0619:
    guideline: Gateways
    section: Authenticating to networks accessed via gateways
    statement: Users authenticate to other networks accessed via gateways.
  ISM-0622:
    guideline: Gateways
    section: Authenticating to networks accessed via gateways
    statement: IT equipment authenticates to other networks accessed via gateways.
  ISM-0628:
    guideline: Gateways
    section: Implementing gateways
    statement: Gateways are implemented between networks belonging to different security domains.
  ISM-0629:
    guideline: Gateways
    section: System administration of gateways
    statement: For gateways between networks belonging to different security domains, any shared components are managed by
      system administrators for the higher security domain or by system administrators from a mutually agreed upon third party.
  ISM-0631:
    guideline: Gateways
    section: Implementing gateways
    statement: Gateways only allow explicitly authorised data flows.
  ISM-0634:
    guideline: Gateways
    section: Gateway event logging
    statement: 'Security-relevant events for gateways are centrally logged, including:


      - data packets and data flows permitted through gateways

      - data packets and data flows attempting to leave gateways

      - real-time alerts for attempted intrusions.'
  ISM-0637:
    guideline: Gateways
    section: Implementing gateways
    statement: Gateways implement a demilitarised zone if external parties require access to an organisation’s services.
  ISM-0639:
    guideline: Firewalls
    section: Using firewalls
    statement: Evaluated firewalls are used between networks belonging to different security domains.
  ISM-0643:
    guideline: Diodes
    section: Using diodes
    statement: Evaluated diodes are used for controlling the data flow of unidirectional gateways between an organisation’s
      networks and public network infrastructure.
  ISM-0649:
    guideline: Content filtering
    section: Allowing specific content types
    statement: Files imported or exported via gateways or CDSs are filtered for allowed file types.
  ISM-0651:
    guideline: Content filtering
    section: Performing content filtering
    statement: Files identified by content filtering checks as malicious, or that cannot be inspected, are blocked.
  ISM-0652:
    guideline: Content filtering
    section: Performing content filtering
    statement: Files identified by content filtering checks as suspicious are quarantined until reviewed and subsequently
      approved or not approved for release.
  ISM-0657:
    guideline: Data transfers
    section: Manual import of data
    statement: When manually importing data to systems, the data is scanned for malicious and active content.
  ISM-0659:
    guideline: Content filtering
    section: Performing content filtering
    statement: Files imported or exported via gateways or CDSs undergo content filtering checks.
  ISM-0661:
    guideline: Data transfers
    section: Accountability for data transfers
    statement: Human users transferring data to and from systems are held accountable for data transfers they perform.
  ISM-0663:
    guideline: Data transfers
    section: Data transfer processes and procedures
    statement: Data transfer processes, and supporting data transfer procedures, are developed, implemented and maintained.
  ISM-0677:
    guideline: Content filtering
    section: Validating file integrity
    statement: Files imported or exported via gateways or CDSs that have a digital signature or cryptographic checksum are
      validated.
  ISM-0701:
    guideline: Mobile device usage
    section: Mobile device emergency sanitisation processes and procedures
    statement: Mobile device emergency sanitisation processes, and supporting mobile device emergency sanitisation procedures,
      are developed, implemented and maintained.
  ISM-0705:
    guideline: Enterprise mobility
    section: Mobile devices and desktop computers accessing the internet
    statement: When accessing an organisation’s network via a VPN connection, split tunnelling is disabled.
  ISM-0714:
    guideline: Chief information security officer
    section: Providing cyber security leadership and guidance
    statement: A CISO is appointed to provide cyber security leadership and guidance for their organisation (covering IT and
      OT).
  ISM-0717:
    guideline: Chief information security officer
    section: Overseeing cyber security personnel
    statement: The CISO oversees the management of cyber security personnel within their organisation.
  ISM-0718:
    guideline: Chief information security officer
    section: Reporting on cyber security
    statement: The CISO regularly reports directly to their organisation’s board of directors or executive committee on cyber
      security matters.
  ISM-0720:
    guideline: Chief information security officer
    section: Communicating a cyber security vision and strategy
    statement: The CISO oversees the development, implementation and maintenance of a cyber security communications strategy
      to assist in communicating the cyber security vision and strategy for their organisation.
  ISM-0724:
    guideline: Chief information security officer
    section: Overseeing the cyber security program
    statement: The CISO implements cyber security measurement metrics and key performance indicators for their organisation.
  ISM-0725:
    guideline: Chief information security officer
    section: Coordinating cyber security
    statement: The CISO coordinates cyber security and business alignment through a cyber security steering committee or advisory
      board, comprising key cyber security and business executives, which meets formally and regularly.
  ISM-0726:
    guideline: Chief information security officer
    section: Coordinating cyber security
    statement: The CISO coordinates security risk management activities between cyber security and business teams.
  ISM-0731:
    guideline: Chief information security officer
    section: Working with suppliers
    statement: The CISO oversees cyber supply chain risk management activities for their organisation.
  ISM-0732:
    guideline: Chief information security officer
    section: Receiving and managing a dedicated cyber security budget
    statement: The CISO receives and manages a dedicated cyber security budget for their organisation.
  ISM-0733:
    guideline: Chief information security officer
    section: Overseeing cyber security incident response activities
    statement: The CISO is fully aware of all cyber security incidents within their organisation.
  ISM-0734:
    guideline: Chief information security officer
    section: Contributing to business continuity and disaster recovery planning
    statement: The CISO contributes to the development, implementation and maintenance of business continuity and disaster
      recovery plans for their organisation to ensure that business-critical services are supported appropriately in the event
      of a disaster.
  ISM-0735:
    guideline: Chief information security officer
    section: Overseeing cyber security awareness training
    statement: The CISO oversees the development, implementation and maintenance of their organisation’s cyber security awareness
      training program.
  ISM-0810:
    guideline: Facilities and systems
    section: Physical access to systems
    statement: Classified systems are secured in facilities that meet the requirements for a security zone suitable for their
      classification.
  ISM-0813:
    guideline: Facilities and systems
    section: Physical access to servers, network devices and cryptographic equipment
    statement: Server rooms, communications rooms and security containers are not left in unsecured states.
  ISM-0817:
    guideline: Cyber security awareness training
    section: Reporting suspicious contact via online services
    statement: Personnel are advised of what suspicious contact via online services is and how to report it.
  ISM-0820:
    guideline: Cyber security awareness training
    section: Posting work-related information on online services
    statement: Personnel are advised not to post work-related information on unauthorised online services, and to report cases
      where such information is posted.
  ISM-0821:
    guideline: Cyber security awareness training
    section: Posting personal information on online services
    statement: Personnel are advised of security risks associated with posting personal information on online services.
  ISM-0824:
    guideline: Cyber security awareness training
    section: Sending and receiving files via online services
    statement: Personnel are advised not to send or receive files via unauthorised online services.
  ISM-0831:
    guideline: Media usage
    section: Handling media
    statement: Media is handled in a manner suitable for its sensitivity or classification.
  ISM-0836:
    guideline: Media sanitisation
    section: Non-volatile electrically erasable programmable read-only memory media sanitisation
    statement: Non-volatile EEPROM media is sanitised by overwriting it at least once in its entirety with a random pattern
      followed by a read back for verification.
  ISM-0839:
    guideline: Media destruction
    section: Outsourcing media destruction
    statement: The destruction of media storing accountable material is not outsourced.
  ISM-0840:
    guideline: Media destruction
    section: Outsourcing media destruction
    statement: When outsourcing the destruction of media storing non-accountable material, a National Association for Information
      Destruction AAA certified destruction service with endorsements, as specified in ASIO’s Protective Security Circular-167,
      is used.
  ISM-0843:
    guideline: Operating system hardening
    section: Application control
    statement: Application control is implemented on workstations.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-0846:
    guideline: Operating system hardening
    section: Application control
    statement: Users cannot disable or bypass application control, and are not exempted from application control, except when
      using local administrator accounts or break glass accounts.
  ISM-0853:
    guideline: Identity and access management
    section: Session termination
    statement: Interactive user sessions are terminated and workstations are restarted at least daily.
  ISM-0861:
    guideline: Email gateways and servers
    section: DomainKeys Identified Mail
    statement: DKIM signing is enabled on emails originating from an organisation’s domains (including subdomains).
  ISM-0863:
    guideline: Mobile device management
    section: Maintaining mobile device security
    statement: Mobile devices prevent personnel from installing non-approved applications once provisioned.
  ISM-0864:
    guideline: Mobile device management
    section: Maintaining mobile device security
    statement: Mobile devices prevent personnel from disabling or modifying security functionality once provisioned.
  ISM-0866:
    guideline: Mobile device usage
    section: Using mobile devices in public spaces
    statement: Sensitive or classified data is not viewed on mobile devices in public locations unless care is taken to reduce
      the chance of the screen of a mobile device being observed.
  ISM-0869:
    guideline: Mobile device management
    section: Encrypted storage
    statement: Mobile devices encrypt their internal storage and any removable media using ASD-approved cryptography.
  ISM-0870:
    guideline: Mobile device usage
    section: Maintaining control of mobile devices
    statement: Mobile devices are carried or stored in a secured state when not being actively used.
  ISM-0871:
    guideline: Mobile device usage
    section: Maintaining control of mobile devices
    statement: Mobile devices are kept under continual direct supervision when being actively used.
  ISM-0874:
    guideline: Enterprise mobility
    section: Mobile devices and desktop computers accessing the internet
    statement: Mobile devices and desktop computers access the internet via an organisation’s internet gateway rather than
      via a direct connection to the internet.
  ISM-0888:
    guideline: Development and maintenance of cyber security documentation
    section: Maintenance of cyber security documentation
    statement: Cyber security documentation is reviewed at least annually and includes a ‘current as at \[date\]’ or equivalent
      statement.
  ISM-0912:
    guideline: System-specific cyber security documentation
    section: Change and configuration management plan
    statement: 'Systems have a change and configuration management plan that includes:


      - the establishment and maintenance of authorised baseline configurations for systems

      - what constitutes routine and urgent changes to the configuration of systems

      - how changes to the configuration of systems will be requested, tracked and documented

      - who needs to be consulted prior to routine and urgent changes to the configuration of systems

      - who needs to approve routine and urgent changes to the configuration of systems

      - who needs to be notified of routine and urgent changes to the configuration of systems

      - what additional change management and configuration management processes and procedures need to be followed before,
      during and after routine and urgent changes to the configuration of systems.'
  ISM-0917:
    guideline: Responding to cyber security incidents
    section: Handling and containing malicious code infections
    statement: 'When malicious code is detected, the following steps are taken to handle the infection:


      - the infected systems are isolated

      - all previously connected media used in the period leading up to the infection are scanned for signs of infection and
      isolated if necessary

      - antivirus applications are used to remove the infection from infected systems and media

      - if the infection cannot be reliably removed, systems are restored from a known good backup or rebuilt.'
  ISM-0926:
    guideline: Cabling infrastructure
    section: Cable colours
    statement: 'Non-classified, OFFICIAL: Sensitive and PROTECTED cables are coloured neither salmon pink nor red.'
  ISM-0931:
    guideline: Telephone systems
    section: Off-hook audio protection
    statement: In SECRET and TOP SECRET areas, push-to-talk handsets or push-to-talk headsets are used to meet any off-hook
      audio protection requirements.
  ISM-0938:
    guideline: User application hardening
    section: User application selection
    statement: Vendors that have demonstrated a commitment to Secure by Design and Secure by Default principles and practices,
      including secure programming practices and either memory-safe programming languages or less preferably memory-safe programming
      practices, are used for user applications.
  ISM-0947:
    guideline: Media usage
    section: Using media for data transfers
    statement: When transferring data manually between two systems belonging to different security domains, rewritable media
      is sanitised after each data transfer.
  ISM-0955:
    guideline: Operating system hardening
    section: Application control
    statement: Application control is implemented using cryptographic hash rules, publisher certificate rules or path rules.
  ISM-0958:
    guideline: Web content filters
    section: Allowing and blocking access to domain names
    statement: An organisation-approved list of domain names, or list of website categories, is implemented for all Hypertext
      Transfer Protocol and Hypertext Transfer Protocol Secure traffic communicated through gateways.
  ISM-0961:
    guideline: Web content filters
    section: Using web content filters
    statement: Client-side active content is restricted by web content filters to an organisation-approved list of domain
      names.
  ISM-0963:
    guideline: Web content filters
    section: Using web content filters
    statement: Web content filtering is implemented to filter potentially harmful web-based content.
  ISM-0971:
    guideline: Web application development
    section: Secure web application design and development
    statement: The OWASP Application Security Verification Standard is used in the development of web applications.
  ISM-0974:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication is used to authenticate unprivileged human users of systems.
    essential_eight:
    - ML2
    - ML3
  ISM-0988:
    guideline: Security monitoring
    section: Centralised event logging facility
    statement: An accurate and consistent time source is used for event logging.
  ISM-0994:
    guideline: Cryptographic algorithms
    section: Asymmetric cryptographic algorithms
    statement: ECDH is used in preference to DH.
  ISM-0998:
    guideline: Internet Protocol Security
    section: Integrity algorithms
    statement: AUTH_HMAC_SHA2_256_128, AUTH_HMAC_SHA2_384_192, AUTH_HMAC_SHA2_512_256 or NONE (only with AES-GCM) is used
      for authenticating IPsec connections, preferably NONE.
  ISM-0999:
    guideline: Internet Protocol Security
    section: Diffie-Hellman groups
    statement: DH or ECDH is used for key establishment of IPsec connections, preferably 384-bit random ECP group, 3072-bit
      MODP Group or 4096-bit MODP Group.
  ISM-1000:
    guideline: Internet Protocol Security
    section: Perfect Forward Secrecy
    statement: PFS is used for IPsec connections.
  ISM-1006:
    guideline: Network design and configuration
    section: Network management traffic
    statement: Security measures are implemented to prevent unauthorised access to network management traffic.
  ISM-1019:
    guideline: Video conferencing and Internet Protocol telephony
    section: Denial of service response plan
    statement: A denial of service response plan for video conferencing and IP telephony services is developed, implemented
      and maintained.
  ISM-1023:
    guideline: Email usage
    section: Handling emails with inappropriate, invalid or missing protective markings
    statement: The intended recipients of blocked inbound emails, and the senders of blocked outbound emails, are notified.
  ISM-1024:
    guideline: Email gateways and servers
    section: Notifications of undeliverable emails
    statement: Notifications of undeliverable emails are only sent to senders that can be verified via SPF or other trusted
      means.
  ISM-1026:
    guideline: Email gateways and servers
    section: DomainKeys Identified Mail
    statement: DKIM signatures on incoming emails are verified.
  ISM-1027:
    guideline: Email gateways and servers
    section: DomainKeys Identified Mail
    statement: Email distribution list applications used by external senders is configured such that it does not break the
      validity of the sender’s DKIM signature.
  ISM-1028:
    guideline: Network design and configuration
    section: Using network-based intrusion detection and prevention systems
    statement: A NIDS or NIPS is deployed in gateways between an organisation’s networks and other networks they do not manage.
  ISM-1030:
    guideline: Network design and configuration
    section: Using network-based intrusion detection and prevention systems
    statement: A NIDS or NIPS is located immediately inside the outermost firewall for gateways and configured to generate
      event logs and alerts for network traffic that contravenes any rule in a firewall ruleset.
  ISM-1034:
    guideline: Operating system hardening
    section: Host-based intrusion detection and response solution
    statement: A HIPS or EDR solution is implemented on critical servers and high-value servers.
  ISM-1036:
    guideline: Multifunction devices
    section: Observing multifunction device use
    statement: MFDs are placed in areas where their use can be observed.
  ISM-1037:
    guideline: Gateways
    section: Assessment of gateways
    statement: Gateways undergo testing following configuration changes, and at regular intervals no more than six months
      apart, to validate that they conform to expected security configurations.
  ISM-1053:
    guideline: Facilities and systems
    section: Physical access to servers, network devices and cryptographic equipment
    statement: Classified servers, network devices and cryptographic equipment are secured in server rooms or communications
      rooms that meet the requirements for a security zone suitable for their classification.
  ISM-1055:
    guideline: Identity and access management
    section: Insecure authentication methods
    statement: LAN Manager and NT LAN Manager authentication methods are disabled.
  ISM-1059:
    guideline: Media usage
    section: Encrypting media
    statement: All data stored on media is encrypted using ASD-approved cryptography.
  ISM-1065:
    guideline: Media sanitisation
    section: Non-volatile magnetic media sanitisation
    statement: The host-protected area and device configuration overlay table are reset prior to the sanitisation of non-volatile
      magnetic hard drives.
  ISM-1067:
    guideline: Media sanitisation
    section: Non-volatile magnetic media sanitisation
    statement: The ATA secure erase command is used, in addition to block overwriting software, to ensure the growth defects
      table of non-volatile magnetic hard drives is overwritten.
  ISM-1071:
    guideline: System owners
    section: System ownership and oversight
    statement: Each system has a designated system owner.
  ISM-1073:
    guideline: Managed services and cloud services
    section: Access to systems by service providers
    statement: An organisation’s systems are not accessed or administered by a service provider unless a contractual arrangement
      exists between the organisation and the service provider to do so.
  ISM-1074:
    guideline: Facilities and systems
    section: Physical access to servers, network devices and cryptographic equipment
    statement: Keys or equivalent access mechanisms to server rooms, communications rooms and security containers are appropriately
      controlled.
  ISM-1076:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising televisions and computer monitors
    statement: Televisions and computer monitors with minor burn-in or image persistence are sanitised by displaying a solid
      white image on the screen for an extended period.
  ISM-1078:
    guideline: Telephone systems
    section: Telephone system usage policy
    statement: A telephone system usage policy is developed, implemented and maintained.
  ISM-1080:
    guideline: Cryptographic algorithms
    section: Using cryptographic algorithms
    statement: An AACA or high assurance cryptographic algorithm is used when encrypting data at rest.
  ISM-1082:
    guideline: Mobile device usage
    section: Mobile device usage policy
    statement: A mobile device usage policy is developed, implemented and maintained.
  ISM-1083:
    guideline: Mobile device usage
    section: Personnel awareness
    statement: Personnel are advised of the sensitivity or classification permitted for voice and data communications when
      using mobile devices.
  ISM-1084:
    guideline: Mobile device usage
    section: Maintaining control of mobile devices
    statement: If unable to carry or store mobile devices in a secured state, they are physically transferred in a security
      briefcase or an approved multi-use satchel, pouch or transit bag.
  ISM-1085:
    guideline: Mobile device management
    section: Encrypted communications
    statement: Mobile devices encrypt all sensitive or classified data communicated over public network infrastructure using
      ASD-approved cryptography.
  ISM-1088:
    guideline: Mobile device usage
    section: While travelling overseas with mobile devices
    statement: 'Personnel report the potential compromise of mobile devices, removable media or credentials to their organisation
      as soon as possible, especially if they:


      - provide credentials to foreign government officials

      - decrypt mobile devices for foreign government officials

      - have mobile devices taken out of sight by foreign government officials

      - have mobile devices or removable media stolen, including if later returned

      - lose mobile devices or removable media, including if later found

      - observe unusual behaviour of mobile devices.'
  ISM-1089:
    guideline: Email usage
    section: Protective marking tools
    statement: When replying to or forwarding emails, protective marking tools do not allow the selection of protective markings
      lower than previously used.
  ISM-1091:
    guideline: Cryptographic fundamentals
    section: Reporting cryptographic-related cyber security incidents
    statement: Keying material is changed when compromised or suspected of being compromised.
  ISM-1095:
    guideline: Cabling infrastructure
    section: Labelling wall outlet boxes
    statement: Wall outlet boxes denote the systems, cable identifiers and wall outlet box identifier.
  ISM-1096:
    guideline: Cabling infrastructure
    section: Labelling cables
    statement: Cables are labelled at each end with sufficient source and destination details to enable the physical identification
      and inspection of the cable.
  ISM-1101:
    guideline: Cabling infrastructure
    section: Connecting cable reticulation systems to cabinets
    statement: In TOP SECRET areas, cable reticulation systems leading into cabinets in server rooms or communications rooms
      are terminated as close as possible to the cabinet.
  ISM-1102:
    guideline: Cabling infrastructure
    section: Connecting cable reticulation systems to cabinets
    statement: Cable reticulation systems leading into cabinets are terminated as close as possible to the cabinet.
  ISM-1103:
    guideline: Cabling infrastructure
    section: Connecting cable reticulation systems to cabinets
    statement: In TOP SECRET areas, cable reticulation systems leading into cabinets not in server rooms or communications
      rooms are terminated at the boundary of the cabinet.
  ISM-1107:
    guideline: Cabling infrastructure
    section: Wall outlet box colours
    statement: 'Non-classified, OFFICIAL: Sensitive and PROTECTED wall outlet boxes are coloured neither salmon pink nor red.'
  ISM-1109:
    guideline: Cabling infrastructure
    section: Wall outlet box covers
    statement: Wall outlet box covers are clear plastic.
  ISM-1111:
    guideline: Cabling infrastructure
    section: Use of fibre-optic cables
    statement: Fibre-optic cables are used for cabling infrastructure instead of copper cables.
  ISM-1112:
    guideline: Cabling infrastructure
    section: Cable inspectability
    statement: Cables in non-TOP SECRET areas are inspectable every five metres or less.
  ISM-1114:
    guideline: Cabling infrastructure
    section: Common cable reticulation systems
    statement: Cable bundles or conduits sharing a common cable reticulation system have a dividing partition or visible gap
      between each cable bundle and conduit.
  ISM-1115:
    guideline: Cabling infrastructure
    section: Cables in walls
    statement: Cables from cable trays to wall outlet boxes are run in flexible or plastic conduit.
  ISM-1119:
    guideline: Cabling infrastructure
    section: Cable inspectability
    statement: Cables in TOP SECRET areas are fully inspectable for their entire length.
  ISM-1130:
    guideline: Cabling infrastructure
    section: Enclosed cable reticulation systems
    statement: In shared facilities, cables are run in an enclosed cable reticulation system.
  ISM-1139:
    guideline: Transport Layer Security
    section: Configuring Transport Layer Security
    statement: Only the latest version of TLS is used for TLS connections.
  ISM-1143:
    guideline: System maintenance
    section: Patch management processes and procedures
    statement: Patch management processes, and supporting patch management procedures, are developed, implemented and maintained.
  ISM-1146:
    guideline: Cyber security awareness training
    section: Posting personal information on online services
    statement: Personnel are advised to maintain separate personal user accounts from any work user accounts they use for
      online services.
  ISM-1151:
    guideline: Email gateways and servers
    section: Sender Policy Framework
    statement: SPF is used to verify the authenticity of incoming emails.
  ISM-1157:
    guideline: Diodes
    section: Using diodes
    statement: Evaluated diodes are used for controlling the data flow of unidirectional gateways between networks.
  ISM-1160:
    guideline: Media destruction
    section: Media destruction equipment
    statement: If using degaussers to destroy media, degaussers evaluated by the United States’ National Security Agency are
      used.
  ISM-1163:
    guideline: System-specific cyber security documentation
    section: Continuous monitoring plan
    statement: 'Systems have a continuous monitoring plan that includes:


      - conducting security assessment activities to identify vulnerabilities

      - analysing identified vulnerabilities to determine their potential impact

      - implementing mitigations based on risk, effectiveness and cost.'
  ISM-1164:
    guideline: Cabling infrastructure
    section: Covers for enclosed cable reticulation systems
    statement: In shared facilities, conduits or the front covers of ducts, cable trays in floors and ceilings, and associated
      fittings are clear plastic.
  ISM-1171:
    guideline: Web content filters
    section: Allowing and blocking access to domain names
    statement: Attempts to access websites through their IP addresses instead of their domain names are blocked by web content
      filters.
  ISM-1173:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication is used to authenticate privileged human users of systems.
    essential_eight:
    - ML2
    - ML3
  ISM-1175:
    guideline: Identity and access management
    section: Privileged access to systems
    statement: Privileged user accounts (excluding those explicitly authorised to access online services) are prevented from
      accessing the internet, email and web services.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1178:
    guideline: Network design and configuration
    section: Network documentation
    statement: Network documentation provided to a third party, or published in public tender documentation, only contains
      details necessary for other parties to undertake contractual services.
  ISM-1181:
    guideline: Network design and configuration
    section: Network segmentation and segregation
    statement: Networks are segregated into multiple network zones according to the criticality of servers, services and data.
  ISM-1182:
    guideline: Network design and configuration
    section: Network access controls
    statement: Network access controls are implemented to limit the flow of network traffic within and between network segments
      to only that required for business purposes.
  ISM-1183:
    guideline: Email gateways and servers
    section: Sender Policy Framework
    statement: A hard fail SPF record is used when specifying authorised email servers (or lack thereof) for an organisation’s
      domains (including subdomains).
  ISM-1186:
    guideline: Network design and configuration
    section: Using Internet Protocol version 6
    statement: IPv6 capable network security appliances are used on IPv6 and dual-stack networks.
  ISM-1187:
    guideline: Data transfers
    section: Manual export of data
    statement: When manually exporting data from systems, the data is checked for unsuitable protective markings.
  ISM-1192:
    guideline: Gateways
    section: Implementing gateways
    statement: Gateways inspect and filter data flows at the transport and above network layers.
  ISM-1195:
    guideline: Mobile device management
    section: Mobile device management policy
    statement: Mobile Device Management solutions that have completed a Common Criteria evaluation against the Protection
      Profile for Mobile Device Management, version 4.0 or later, are used to enforce mobile device management policy.
  ISM-1196:
    guideline: Mobile device usage
    section: Using Bluetooth functionality
    statement: 'Non-classified, OFFICIAL: Sensitive and PROTECTED mobile devices are configured to remain undiscoverable to
      other Bluetooth devices except during Bluetooth pairing.'
  ISM-1198:
    guideline: Mobile device usage
    section: Using Bluetooth functionality
    statement: 'Bluetooth pairing for non-classified, OFFICIAL: Sensitive and PROTECTED mobile devices is performed in a manner
      such that connections are only made between intended Bluetooth devices.'
  ISM-1199:
    guideline: Mobile device usage
    section: Using Bluetooth functionality
    statement: 'Bluetooth pairings for non-classified, OFFICIAL: Sensitive and PROTECTED mobile devices are removed when there
      is no longer a requirement for their use.'
  ISM-1200:
    guideline: Mobile device usage
    section: Using Bluetooth functionality
    statement: 'Bluetooth pairing for non-classified, OFFICIAL: Sensitive and PROTECTED mobile devices is performed using
      Secure Connections, preferably with Numeric Comparison if supported.'
  ISM-1203:
    guideline: System owners
    section: Protecting systems and their resources
    statement: System owners, in consultation with each system’s authorising officer, conduct a threat and risk assessment
      for each system.
  ISM-1211:
    guideline: System administration
    section: System administration processes and procedures
    statement: System administration activities are performed in accordance with the system’s change and configuration management
      plan.
  ISM-1213:
    guideline: Responding to cyber security incidents
    section: Handling and containing intrusions
    statement: Following intrusion remediation activities, enhanced monitoring is conducted until there is sufficient evidence-based
      confidence that malicious actors have been eradicated from a system and have not re-established access.
  ISM-1217:
    guideline: IT equipment disposal
    section: Disposal of IT equipment
    statement: Labels and markings indicating the owner, sensitivity, classification or any other marking that can associate
      IT equipment with its prior use are removed prior to its disposal.
  ISM-1219:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising printers and multifunction devices
    statement: MFD print drums and image transfer rollers are inspected and destroyed if there is remnant toner that cannot
      be removed or a print is visible on the image transfer roller.
  ISM-1220:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising printers and multifunction devices
    statement: Printer and MFD platens are inspected and destroyed if any text or images are retained on the platen.
  ISM-1221:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising printers and multifunction devices
    statement: Printers and MFDs are checked to ensure no pages are trapped in the paper path due to a paper jam.
  ISM-1222:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising televisions and computer monitors
    statement: Televisions and computer monitors that cannot be sanitised are destroyed.
  ISM-1223:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising network devices
    statement: 'Memory in network devices is sanitised using the following processes, in order of preference:


      - following device-specific guidance provided in evaluation documentation

      - following vendor sanitisation guidance

      - loading a dummy configuration file, performing a factory reset and then reinstalling firmware.'
  ISM-1227:
    guideline: Credential management
    section: Setting credentials for user accounts
    statement: Credentials set for user accounts are randomly generated.
  ISM-1228:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Cyber security events are analysed in a timely manner to identify cyber security incidents.
    essential_eight:
    - ML2
    - ML3
  ISM-1233:
    guideline: Internet Protocol Security
    section: Key exchange
    statement: IKE version 2 is used for key exchange when establishing IPsec connections.
  ISM-1234:
    guideline: Email gateways and servers
    section: Email content filtering
    statement: Email content filtering is implemented to filter potentially harmful content in email bodies and attachments.
  ISM-1235:
    guideline: User application hardening
    section: Hardening user application configurations
    statement: Extensions for user applications are restricted to an organisation-approved set.
  ISM-1236:
    guideline: Web content filters
    section: Allowing and blocking access to domain names
    statement: Malicious domain names, dynamic domain names and domain names that can be registered anonymously for free are
      blocked by web content filters.
  ISM-1237:
    guideline: Web content filters
    section: Using web content filters
    statement: Web content filtering is applied to outbound web traffic where appropriate.
  ISM-1238:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Threat modelling is used in support of the software development life cycle.
  ISM-1239:
    guideline: Web application development
    section: Secure web application design and development
    statement: Robust web application frameworks are used in the development of web applications.
  ISM-1240:
    guideline: Software development fundamentals
    section: Software input handling
    statement: Validation and sanitisation are performed on all input received over the internet by software.
  ISM-1241:
    guideline: Web application development
    section: Web application output encoding
    statement: Output encoding is performed on all output produced by web applications.
  ISM-1243:
    guideline: Databases
    section: Database register
    statement: A database register is developed, implemented, maintained and regularly verified.
  ISM-1245:
    guideline: Server application hardening
    section: Hardening server application configurations
    statement: All temporary installation files created during server application installation processes are removed after
      server applications have been installed.
  ISM-1246:
    guideline: Server application hardening
    section: Hardening server application configurations
    statement: Server applications are hardened using ASD and vendor hardening guidance, with the most restrictive guidance
      taking precedence when conflicts occur.
  ISM-1247:
    guideline: Server application hardening
    section: Hardening server application configurations
    statement: Unneeded user accounts, components, services and functionality of server applications are disabled or removed.
  ISM-1249:
    guideline: Server application hardening
    section: Restricting privileges for server applications
    statement: Server applications are configured to run as a separate user account with the minimum privileges needed to
      perform their functions.
  ISM-1250:
    guideline: Server application hardening
    section: Restricting privileges for server applications
    statement: The user accounts under which server applications run have limited access to their underlying server’s file
      system.
  ISM-1255:
    guideline: Databases
    section: Protecting database contents
    statement: Database users’ ability to access, insert, modify and remove database contents is restricted based on their
      duties or functions.
  ISM-1256:
    guideline: Databases
    section: Protecting databases
    statement: File-based access controls are applied to database files.
  ISM-1260:
    guideline: Server application hardening
    section: Hardening server application configurations
    statement: Default user accounts or credentials for server applications, including for any pre-configured user accounts,
      are changed, disabled or removed during initial setup.
  ISM-1263:
    guideline: Identity and access management
    section: Privileged access to systems
    statement: Unique privileged user accounts are used for administering individual server applications.
  ISM-1268:
    guideline: Databases
    section: Protecting database contents
    statement: The need-to-know principle is enforced for database contents through the application of minimum privileges,
      database views, database roles and data tokenisation.
  ISM-1269:
    guideline: Database servers
    section: Functional separation between database servers and web servers
    statement: Database servers and web servers are functionally separated.
  ISM-1270:
    guideline: Database servers
    section: Network environment
    statement: Database servers are placed on a different network segment to workstations.
  ISM-1271:
    guideline: Database servers
    section: Network environment
    statement: Network access controls are implemented to restrict database server communications to strictly defined network
      resources that require access to the database server.
  ISM-1272:
    guideline: Database servers
    section: Network environment
    statement: If only local access to a database is required, networking functionality of database management system applications
      is disabled or directed to listen solely to the localhost interface.
  ISM-1273:
    guideline: Database servers
    section: Segregation of development, testing, staging and production database servers
    statement: Database servers for development, testing, staging and production environments are segregated.
  ISM-1274:
    guideline: Databases
    section: Segregation of development, testing, staging and production databases
    statement: Database contents from production environments are not used in non-production environments unless the non-production
      environment is secured to at least the same level as the production environment.
  ISM-1275:
    guideline: Software development fundamentals
    section: Software interaction with databases
    statement: All queries to databases from software are filtered for legitimate content and correct syntax.
  ISM-1276:
    guideline: Software development fundamentals
    section: Software interaction with databases
    statement: Parameterised queries or stored procedures, instead of dynamically generated queries, are used by software
      for database interactions.
  ISM-1277:
    guideline: Database servers
    section: Communications between database servers and web servers
    statement: Data communicated between database servers and web servers is encrypted using Australian Signals Directorate-approved
      cryptography.
  ISM-1278:
    guideline: Software development fundamentals
    section: Software interaction with databases
    statement: Software is designed or configured to provide as little error information as possible about the structure of
      databases.
  ISM-1284:
    guideline: Content filtering
    section: Content validation
    statement: Files imported or exported via gateways or CDSs undergo content validation.
  ISM-1286:
    guideline: Content filtering
    section: Content conversion
    statement: Files imported or exported via gateways or CDSs undergo content conversion.
  ISM-1287:
    guideline: Content filtering
    section: Content sanitisation
    statement: Files imported or exported via gateways or CDSs undergo content sanitisation.
  ISM-1288:
    guideline: Content filtering
    section: Antivirus scanning
    statement: Files imported or exported via gateways or CDSs undergo antivirus scanning using multiple different scanning
      engines.
  ISM-1289:
    guideline: Content filtering
    section: Archive files
    statement: Archive files imported or exported via gateways or CDSs are unpacked to undergo content filtering checks.
  ISM-1290:
    guideline: Content filtering
    section: Archive files
    statement: Archive files are unpacked in a controlled manner to ensure content filter performance or availability is not
      adversely affected.
  ISM-1293:
    guideline: Content filtering
    section: Encrypted files
    statement: Encrypted files imported or exported via gateways or CDSs are decrypted to undergo content filtering checks.
  ISM-1294:
    guideline: Data transfers
    section: Monitoring data import and export
    statement: Data transfer logs for systems are partially verified at least monthly.
  ISM-1296:
    guideline: Facilities and systems
    section: Physical access to network devices in public areas
    statement: Physical security is implemented to protect network devices in public areas from physical damage or unauthorised
      access.
  ISM-1297:
    guideline: Enterprise mobility
    section: Privately owned mobile devices and desktop computers
    statement: Legal advice is sought prior to allowing privately owned mobile devices and desktop computers to access systems
      or data.
  ISM-1298:
    guideline: Mobile device usage
    section: Before travelling overseas with mobile devices
    statement: Personnel are advised of privacy and security risks when travelling overseas with mobile devices.
  ISM-1299:
    guideline: Mobile device usage
    section: Personnel awareness
    statement: 'Personnel are advised to take the following precautions when using mobile devices:


      - never leave mobile devices or removable media unattended, including by placing them in checked-in luggage or leaving
      them in hotel safes

      - never store credentials with mobile devices that they grant access to, such as in laptop computer bags

      - never lend mobile devices or removable media to untrusted people, even if briefly

      - never allow untrusted people to connect their mobile devices or removable media to your mobile devices, including
      for charging

      - never connect mobile devices to designated charging stations or wall outlet charging ports

      - never use gifted or unauthorised peripherals, chargers or removable media with mobile devices

      - never use removable media for data transfers or backups that have not been checked for malicious code beforehand

      - avoid reuse of removable media once used with other parties’ systems or mobile devices

      - avoid connecting mobile devices to open or untrusted Wi-Fi networks

      - consider disabling any communications capabilities of mobile devices when not in use, such as Wi-Fi, Bluetooth, Near
      Field Communication and ultra-wideband

      - consider periodically rebooting mobile devices

      - consider using a VPN connection to encrypt all cellular and wireless communications

      - consider using encrypted email or messaging apps for all communications.'
  ISM-1300:
    guideline: Mobile device usage
    section: After travelling overseas with mobile devices
    statement: 'Upon returning from travelling overseas with mobile devices, personnel take the following actions:


      - sanitise and reset mobile devices, including all removable media

      - decommission any credentials that left their possession during their travel

      - report if significant doubt exists as to the integrity of any mobile devices or removable media.'
  ISM-1304:
    guideline: Network design and configuration
    section: Network device hardening
    statement: Default user accounts or credentials for network devices, including for any pre-configured user accounts, are
      changed, disabled or removed during initial setup.
  ISM-1311:
    guideline: Network design and configuration
    section: Using the Simple Network Management Protocol
    statement: SNMP version 1 and SNMP version 2 are not used on networks.
  ISM-1312:
    guideline: Network design and configuration
    section: Using the Simple Network Management Protocol
    statement: All default SNMP community strings on network devices are changed and write access is disabled.
  ISM-1314:
    guideline: Wireless networks
    section: Choosing wireless devices
    statement: All wireless devices are Wi-Fi Alliance certified.
  ISM-1315:
    guideline: Wireless networks
    section: Administrative interfaces for wireless access points
    statement: The administrative interface on wireless access points is disabled for wireless network connections.
  ISM-1316:
    guideline: Wireless networks
    section: Default settings
    statement: Default SSIDs of wireless access points are changed.
  ISM-1317:
    guideline: Wireless networks
    section: Default settings
    statement: SSIDs of non-public wireless networks are not readily associated with an organisation, the location of their
      premises or the functionality of wireless networks.
  ISM-1318:
    guideline: Wireless networks
    section: Default settings
    statement: SSID broadcasting is not disabled on wireless access points.
  ISM-1319:
    guideline: Wireless networks
    section: Static addressing
    statement: Static addressing is not used for assigning IP addresses on wireless networks.
  ISM-1320:
    guideline: Wireless networks
    section: Media Access Control address filtering
    statement: MAC address filtering is not used to restrict which devices can connect to wireless networks.
  ISM-1321:
    guideline: Network design and configuration
    section: 802.1X authentication and key exchange
    statement: 802.1X with EAP-TLS is used for mutual authentication and key exchange; with all other EAP methods disabled
      on supplicants and authentication servers.
  ISM-1322:
    guideline: Network design and configuration
    section: Evaluation of 802.1X implementations
    statement: Evaluated supplicants, authenticators and authentication servers are used for 802.1X authentication implementations.
  ISM-1323:
    guideline: Network design and configuration
    section: Generating and issuing X.509 certificates for authentication
    statement: X.509 certificates are required for devices and human users authenticating to networks using 802.1X.
  ISM-1324:
    guideline: Network design and configuration
    section: Generating and issuing X.509 certificates for authentication
    statement: X.509 certificates are generated using an evaluated certificate authority or hardware security module.
  ISM-1327:
    guideline: Network design and configuration
    section: Generating and issuing X.509 certificates for authentication
    statement: X.509 certificates are protected by logical and physical access controls and encryption, with those issued
      to human users requiring authentication before use.
  ISM-1330:
    guideline: Wireless networks
    section: Caching 802.1X authentication outcomes
    statement: The PMK caching period is not set to greater than 1440 minutes (24 hours).
  ISM-1332:
    guideline: Wireless networks
    section: Confidentiality and integrity of wireless network traffic
    statement: WPA3-Enterprise 192-bit mode is used to protect the confidentiality and integrity of all wireless network traffic.
  ISM-1334:
    guideline: Wireless networks
    section: Interference between wireless networks
    statement: Wireless networks implement sufficient frequency separation from other wireless networks.
  ISM-1335:
    guideline: Wireless networks
    section: Protecting management frames on wireless networks
    statement: Wireless access points enable the use of the 802.11w amendment to protect management frames.
  ISM-1338:
    guideline: Wireless networks
    section: Wireless network footprint
    statement: Instead of deploying a small number of wireless access points that broadcast on high power, a greater number
      of wireless access points that use less broadcast power are deployed to achieve the desired footprint for wireless networks.
  ISM-1341:
    guideline: Operating system hardening
    section: Host-based intrusion detection and response solution
    statement: A HIPS or EDR solution is implemented on workstations.
  ISM-1359:
    guideline: Media usage
    section: Removable media usage policy
    statement: A removable media usage policy is developed, implemented and maintained.
  ISM-1361:
    guideline: Media destruction
    section: Media destruction equipment
    statement: Security Construction and Equipment Committee-approved equipment or ASIO-approved equipment is used when destroying
      media.
  ISM-1364:
    guideline: Network design and configuration
    section: Using virtual local area networks
    statement: Network devices managing VLANs terminate VLANs belonging to different security domains on separate physical
      network interfaces.
  ISM-1366:
    guideline: Mobile device management
    section: Maintaining mobile device security
    statement: Security updates are applied to mobile devices as soon as they become available.
  ISM-1369:
    guideline: Transport Layer Security
    section: Configuring Transport Layer Security
    statement: AES-GCM is used for encryption of TLS connections.
  ISM-1370:
    guideline: Transport Layer Security
    section: Configuring Transport Layer Security
    statement: Only server-initiated secure renegotiation is used for TLS connections.
  ISM-1372:
    guideline: Transport Layer Security
    section: Configuring Transport Layer Security
    statement: The ephemeral variant of DH or ECDH is used for key establishment of TLS connections.
  ISM-1373:
    guideline: Transport Layer Security
    section: Configuring Transport Layer Security
    statement: Anonymous DH is not used for TLS connections.
  ISM-1374:
    guideline: Transport Layer Security
    section: Configuring Transport Layer Security
    statement: SHA-2-based certificates are used for TLS connections.
  ISM-1375:
    guideline: Transport Layer Security
    section: Configuring Transport Layer Security
    statement: SHA-2 is used for the Hash-based Message Authentication Code (HMAC) and pseudorandom function (PRF) for TLS
      connections.
  ISM-1380:
    guideline: System administration
    section: Separate privileged operating environments
    statement: Privileged human users use separate privileged and unprivileged operating environments.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1385:
    guideline: System administration
    section: Administrative infrastructure
    statement: Administrative infrastructure is segregated from the wider network and the internet.
  ISM-1386:
    guideline: System administration
    section: Administrative infrastructure
    statement: Network management traffic can only originate from administrative infrastructure.
  ISM-1387:
    guideline: System administration
    section: Administrative infrastructure
    statement: Administrative activities are conducted through jump servers.
    essential_eight:
    - ML2
    - ML3
  ISM-1389:
    guideline: Content filtering
    section: Automated dynamic analysis
    statement: Executable files imported via gateways or CDSs are automatically executed in a sandbox to detect any suspicious
      behaviour.
  ISM-1392:
    guideline: Operating system hardening
    section: Application control
    statement: When implementing application control using path rules, only approved users can modify approved files and write
      to approved folders.
  ISM-1395:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: Service providers, including any subcontractors, provide an appropriate level of protection for any data entrusted
      to them or their services.
  ISM-1400:
    guideline: Enterprise mobility
    section: Privately owned mobile devices and desktop computers
    statement: 'Personnel using privately owned mobile devices or desktop computers to access OFFICIAL: Sensitive or PROTECTED
      systems or data have enforced separation of classified data and personal data.'
  ISM-1401:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: 'Multi-factor authentication uses either: something people have and something people know, or something people
      have that is unlocked by something people know or are.'
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1402:
    guideline: Credential management
    section: Protecting credentials
    statement: Credentials stored on systems are protected by a password manager; a hardware security module; or by salting,
      hashing and stretching them before storage within a database.
  ISM-1403:
    guideline: Identity and access management
    section: User account lockouts
    statement: User accounts, except for break glass accounts, are protected by fixed or risk-based lockout mechanisms aligned
      to a maximum of five failed logon attempts, with either indefinite or automated lockout durations.
  ISM-1404:
    guideline: Identity and access management
    section: Suspension of access to systems
    statement: Unprivileged access to systems and their resources are disabled after 45 days of inactivity.
  ISM-1405:
    guideline: Security monitoring
    section: Centralised event logging facility
    statement: A centralised event logging facility is implemented.
  ISM-1406:
    guideline: Operating system hardening
    section: Standard operating environments
    statement: SOEs are used for workstations and servers.
  ISM-1407:
    guideline: Operating system hardening
    section: Operating system releases and versions
    statement: The latest release, or the previous release, of operating systems are used.
    essential_eight:
    - ML3
  ISM-1408:
    guideline: Operating system hardening
    section: Operating system releases and versions
    statement: 64-bit versions of operating systems are used.
  ISM-1409:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Operating systems are hardened using ASD and vendor hardening guidance, with the most restrictive guidance
      taking precedence when conflicts occur.
  ISM-1412:
    guideline: User application hardening
    section: Web browsers
    statement: Web browsers are hardened using ASD and vendor hardening guidance, with the most restrictive guidance taking
      precedence when conflicts occur.
    essential_eight:
    - ML2
    - ML3
  ISM-1416:
    guideline: Operating system hardening
    section: Software firewall
    statement: A software firewall is implemented on workstations and servers to restrict inbound and outbound network connections
      to an organisation-approved set of applications and services.
  ISM-1417:
    guideline: Operating system hardening
    section: Antivirus application
    statement: 'An antivirus application is implemented on workstations and servers with:


      - signature-based detection functionality enabled and set to a high level

      - heuristic-based detection functionality enabled and set to a high level

      - reputation rating functionality enabled

      - ransomware protection functionality enabled

      - detection signatures configured to update at least daily

      - regular scanning configured for all fixed disks and removable media.'
  ISM-1418:
    guideline: Operating system hardening
    section: Device access control
    statement: If there is no business requirement for reading from removable media and devices, such functionality is disabled
      via the use of a device access control application or by disabling external communication interfaces.
  ISM-1419:
    guideline: Software development fundamentals
    section: Development, testing, staging and production environments
    statement: Development and modification of software only take place in development environments.
  ISM-1420:
    guideline: Software development fundamentals
    section: Development, testing, staging and production environments
    statement: Data from production environments is not used in non-production environments unless the non-production environment
      is secured to at least the same level as the production environment.
  ISM-1422:
    guideline: Software development fundamentals
    section: Authoritative source for software
    statement: Unauthorised access to the authoritative source for software is prevented.
  ISM-1424:
    guideline: Web application development
    section: Web security policy response headers
    statement: Content-Security-Policy, Hypertext Transfer Protocol Strict Transport Security and X-Frame-Options are specified
      by web server software via security policy in response headers.
  ISM-1427:
    guideline: Gateways
    section: Implementing gateways
    statement: Gateways perform ingress traffic filtering to detect and prevent IP source address spoofing.
  ISM-1428:
    guideline: Network design and configuration
    section: Using Internet Protocol version 6
    statement: Unless explicitly required, IPv6 tunnelling is disabled on all network devices.
  ISM-1429:
    guideline: Network design and configuration
    section: Using Internet Protocol version 6
    statement: IPv6 tunnelling is blocked by network security appliances at externally connected network boundaries.
  ISM-1430:
    guideline: Network design and configuration
    section: Using Internet Protocol version 6
    statement: Dynamically assigned IPv6 addresses are configured with Dynamic Host Configuration Protocol version 6 in a
      stateful manner with lease data stored in a centralised event logging facility.
  ISM-1431:
    guideline: Service continuity for online services
    section: Denial-of-service attack mitigation strategies
    statement: 'Denial-of-service attack mitigation strategies are discussed with cloud service providers, specifically:


      - their capacity to withstand denial-of-service attacks

      - costs likely to be incurred as a result of denial-of-service attacks

      - availability monitoring and thresholds for notification of denial-of-service attacks

      - thresholds for turning off any online services or functionality during denial-of-service attacks

      - pre-approved actions that can be undertaken during denial-of-service attacks

      - any arrangements with upstream service providers to block malicious network traffic as far upstream as possible.'
  ISM-1432:
    guideline: Service continuity for online services
    section: Denial-of-service attack mitigation strategies
    statement: Domain names for online services are protected via registrar locking and confirming that domain registration
      details are correct.
  ISM-1436:
    guideline: Service continuity for online services
    section: Denial-of-service attack mitigation strategies
    statement: Critical online services are segregated from other online services that are more likely to be targeted as part
      of denial-of-service attacks.
  ISM-1437:
    guideline: Service continuity for online services
    section: Cloud-based hosting of online services
    statement: Cloud service providers are used for hosting online services.
  ISM-1438:
    guideline: Service continuity for online services
    section: Using content delivery networks
    statement: Where a high availability requirement exists for website hosting, CDNs that cache websites are used.
  ISM-1439:
    guideline: Service continuity for online services
    section: Using content delivery networks
    statement: If using CDNs, disclosing the IP addresses of web servers under an organisation’s control (referred to as origin
      servers) is avoided and access to the origin servers is restricted to the CDNs and authorised management networks.
  ISM-1446:
    guideline: Cryptographic algorithms
    section: Using Elliptic Curve Cryptography
    statement: When using elliptic curve cryptography, a suitable curve from NIST SP 800-186 is used.
  ISM-1449:
    guideline: Secure Shell
    section: Authentication mechanisms
    statement: SSH private keys are protected with a password or a key encryption key.
  ISM-1450:
    guideline: Video conferencing and Internet Protocol telephony
    section: Microphones and webcams
    statement: Microphones (including headsets and USB handsets) and webcams are not used with non-TOP SECRET workstations
      in TOP SECRET areas.
  ISM-1451:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: Types of data and its ownership is documented in contractual arrangements with service providers.
  ISM-1452:
    guideline: Cyber supply chain risk management
    section: Cyber supply chain risk management activities
    statement: A supply chain risk assessment is performed for suppliers of operating systems, applications, IT equipment,
      OT equipment and services to assess the impact to a system’s security risk profile.
  ISM-1453:
    guideline: Transport Layer Security
    section: Configuring Transport Layer Security
    statement: Perfect Forward Secrecy (PFS) is used for TLS connections.
  ISM-1454:
    guideline: Network design and configuration
    section: Remote Authentication Dial-In User Service authentication
    statement: Communications between authenticators and a RADIUS server are encapsulated with an additional layer of encryption
      using RADIUS over Internet Protocol Security or RADIUS over Transport Layer Security.
  ISM-1460:
    guideline: Virtualisation hardening
    section: Functional separation between operating environments
    statement: When using a software-based isolation mechanism that consumes shared physical computing resources, the isolation
      mechanism is from a vendor that has demonstrated a commitment to Secure by Design and Secure by Default principles and
      practices, including secure programming practices and either memory-safe programming languages or less preferably memory-safe
      programming practices.
  ISM-1467:
    guideline: User application hardening
    section: User application releases
    statement: The latest release of email clients, office productivity suites, PDF applications, security products and web
      browsers, including their extensions, are used.
  ISM-1470:
    guideline: User application hardening
    section: Hardening user application configurations
    statement: Unneeded user accounts, components, services and functionality of user applications are disabled or removed.
  ISM-1471:
    guideline: Operating system hardening
    section: Application control
    statement: When implementing application control using publisher certificate rules, publisher names and product names
      are used.
  ISM-1478:
    guideline: Chief information security officer
    section: Overseeing the cyber security program
    statement: The CISO oversees their organisation’s cyber security program and ensures their organisation’s compliance with
      cyber security policy, standards, regulations and legislation.
  ISM-1479:
    guideline: Network design and configuration
    section: Functional separation between servers
    statement: Servers minimise communications with other servers at the network and file system level.
  ISM-1482:
    guideline: Enterprise mobility
    section: Organisation-owned mobile devices and desktop computers
    statement: Personnel using organisation-owned mobile devices or desktop computers to access classified systems or data
      have enforced separation of classified data and personal data.
  ISM-1483:
    guideline: Server application hardening
    section: Server application releases
    statement: The latest release of internet-facing server applications is used.
  ISM-1485:
    guideline: User application hardening
    section: Web browsers
    statement: Web browsers do not process web advertisements from the internet.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1486:
    guideline: User application hardening
    section: Web browsers
    statement: Web browsers do not process Java from the internet.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1487:
    guideline: User application hardening
    section: Office productivity suites
    statement: Only privileged human users responsible for checking that Microsoft Office macros are free of malicious code
      can write to and modify content within Trusted Locations.
    essential_eight:
    - ML3
  ISM-1488:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office macros in files originating from the internet are blocked.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1489:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office macro security settings cannot be changed by human users.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1490:
    guideline: Operating system hardening
    section: Application control
    statement: Application control is implemented on internet-facing servers.
    essential_eight:
    - ML2
    - ML3
  ISM-1491:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: 'Unprivileged human users are prevented from running script execution engines, including:


      - Windows Script Host (cscript.exe and wscript.exe)

      - PowerShell (powershell.exe, powershell_ise.exe and pwsh.exe)

      - Command Prompt (cmd.exe)

      - Windows Management Instrumentation (wmic.exe)

      - Microsoft Hypertext Markup Language (HTML) Application Host (mshta.exe).'
  ISM-1492:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Operating system exploit protection functionality is enabled.
  ISM-1493:
    guideline: System administration
    section: Software registers
    statement: Software registers for workstations, servers, network devices and networked IT equipment are developed, implemented,
      maintained and regularly verified.
  ISM-1501:
    guideline: System maintenance
    section: Cessation of support
    statement: Operating systems that are no longer supported by vendors are replaced.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1502:
    guideline: Email gateways and servers
    section: Blocking suspicious emails
    statement: Emails arriving via an external connection where the email source address uses an internal domain, or internal
      subdomain, are blocked at the email gateway.
  ISM-1504:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication is used to authenticate human users to their organisation’s online services that
      process, store or communicate their organisation’s sensitive data.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1505:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication is used to authenticate human users of data repositories.
    essential_eight:
    - ML3
  ISM-1506:
    guideline: Secure Shell
    section: Configuring Secure Shell
    statement: The use of SSH version 1 is disabled for SSH connections.
  ISM-1507:
    guideline: Identity and access management
    section: Privileged access to systems
    statement: Requests for privileged access to systems and their resources are validated when first requested.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1508:
    guideline: Identity and access management
    section: Privileged access to systems
    statement: Privileged access to systems and their resources is limited to only what is required for users to undertake
      their duties or functions.
    essential_eight:
    - ML3
  ISM-1509:
    guideline: Identity and access management
    section: Privileged access to systems
    statement: Privileged access events are centrally logged.
    essential_eight:
    - ML2
    - ML3
  ISM-1510:
    guideline: Data backup and restoration
    section: Digital preservation policy
    statement: A digital preservation policy is developed, implemented and maintained.
  ISM-1511:
    guideline: Data backup and restoration
    section: Performing and retaining backups
    statement: Backups of data, applications and settings are performed and retained in accordance with business criticality
      and business continuity requirements.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1515:
    guideline: Data backup and restoration
    section: Testing restoration of backups
    statement: Restoration of data, applications and settings from backups to a common point in time is tested as part of
      disaster recovery exercises.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1517:
    guideline: Media destruction
    section: Media destruction methods
    statement: Equipment that is capable of reducing microform to a fine powder, with resultant particles not showing more
      than five consecutive characters per particle upon microscopic inspection, is used to destroy microfiche and microfilm.
  ISM-1520:
    guideline: Gateways
    section: System administrators for gateways
    statement: System administrators for gateways undergo appropriate employment screening, and where necessary hold an appropriate
      security clearance, based on the sensitivity or classification of gateways.
  ISM-1525:
    guideline: System owners
    section: System ownership and oversight
    statement: System owners register each system with its authorising officer.
  ISM-1526:
    guideline: System owners
    section: Protecting systems and their resources
    statement: System owners continuously monitor the security of each system, and manage associated cyber threats, security
      risks and security controls.
  ISM-1528:
    guideline: Firewalls
    section: Using firewalls
    statement: Evaluated firewalls are used between an organisation’s networks and public network infrastructure.
  ISM-1530:
    guideline: Facilities and systems
    section: Physical access to servers, network devices and cryptographic equipment
    statement: Classified servers, network devices and cryptographic equipment are secured in security containers suitable
      for their classification taking into account the combination of security zones they reside in.
  ISM-1532:
    guideline: Network design and configuration
    section: Using virtual local area networks
    statement: VLANs are not used to separate network traffic between an organisation’s networks and public network infrastructure.
  ISM-1533:
    guideline: Mobile device management
    section: Mobile device management policy
    statement: A mobile device management policy is developed, implemented and maintained.
  ISM-1534:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising printers and multifunction devices
    statement: Printer ribbons in printers and MFDs are removed and destroyed.
  ISM-1536:
    guideline: Software development fundamentals
    section: Software interaction with databases
    statement: All queries to databases from software, and any resulting crash or error messages, are centrally logged.
  ISM-1537:
    guideline: Databases
    section: Database event logging
    statement: 'Security-relevant events for databases are centrally logged, including:


      - access or modification of particularly important content

      - addition of new users, especially privileged users

      - changes to user roles or privileges

      - attempts to elevate user privileges

      - queries containing comments

      - queries containing multiple embedded queries

      - database and query alerts or failures

      - database structure changes

      - database administrator actions

      - use of executable commands

      - database logons and logoffs.'
  ISM-1540:
    guideline: Email gateways and servers
    section: Domain-based Message Authentication, Reporting and Conformance
    statement: DMARC records are configured for an organisation’s domains (including subdomains) such that emails are rejected
      if they do not pass DMARC checks.
  ISM-1542:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office is configured to prevent activation of Object Linking and Embedding packages.
    essential_eight:
    - ML2
    - ML3
  ISM-1544:
    guideline: Operating system hardening
    section: Application control
    statement: Microsoft’s recommended application blocklist is implemented.
    essential_eight:
    - ML2
    - ML3
  ISM-1546:
    guideline: Identity and access management
    section: Authenticating to systems
    statement: Users are authenticated before they are granted access to a system and its resources.
  ISM-1547:
    guideline: Data backup and restoration
    section: Data backup and restoration processes and procedures
    statement: Data backup processes, and supporting data backup procedures, are developed, implemented and maintained.
  ISM-1548:
    guideline: Data backup and restoration
    section: Data backup and restoration processes and procedures
    statement: Data restoration processes, and supporting data restoration procedures, are developed, implemented and maintained.
  ISM-1549:
    guideline: Media usage
    section: Media management policy
    statement: A media management policy is developed, implemented and maintained.
  ISM-1550:
    guideline: IT equipment disposal
    section: IT equipment disposal processes and procedures
    statement: IT equipment disposal processes, and supporting IT equipment disposal procedures, are developed, implemented
      and maintained.
  ISM-1551:
    guideline: IT equipment usage
    section: IT equipment management policy
    statement: An IT equipment management policy is developed, implemented and maintained.
  ISM-1552:
    guideline: Web application development
    section: Web application interactions
    statement: All web application content is offered exclusively using HTTPS.
  ISM-1553:
    guideline: Transport Layer Security
    section: Configuring Transport Layer Security
    statement: TLS compression is disabled for TLS connections.
  ISM-1554:
    guideline: Mobile device usage
    section: Before travelling overseas with mobile devices
    statement: 'If travelling overseas with mobile devices to high or extreme risk countries, personnel are:


      - issued with newly provisioned user accounts, mobile devices and removable media from a pool of dedicated travel devices
      which are used solely for work-related activities

      - advised on how to apply and inspect tamper seals to key areas of mobile devices

      - advised to avoid taking any personal mobile devices, especially if rooted or jailbroken.'
  ISM-1555:
    guideline: Mobile device usage
    section: Before travelling overseas with mobile devices
    statement: 'Before travelling overseas with mobile devices, personnel take the following actions:


      - record all details of the mobile devices being taken, such as product types, serial numbers and International Mobile
      Equipment Identity numbers

      - update all operating systems and applications

      - remove all non-essential data, applications and user accounts

      - backup all remaining data, applications and settings.'
  ISM-1556:
    guideline: Mobile device usage
    section: After travelling overseas with mobile devices
    statement: 'If returning from travelling overseas with mobile devices to high or extreme risk countries, personnel take
      the following additional actions:


      - reset credentials used with mobile devices, including those used for remote access to their organisation’s systems

      - monitor user accounts for any indicators of compromise, such as failed logon attempts.'
  ISM-1558:
    guideline: Credential management
    section: Password strength
    statement: 'Passwords using a sequence of words for single-factor authentication are not constructed using:


      - a list of categorised words

      - a real sentence in a natural language

      - song lyrics, movie or television show quotes, literature, or any other publicly available material

      - less than 4 random words for non-classified, OFFICIAL: Sensitive and PROTECTED systems; 5 random words for SECRET
      systems; or 6 random words for TOP SECRET systems.'
  ISM-1559:
    guideline: Credential management
    section: Password strength
    statement: 'Passwords used for multi-factor authentication on non-classified, OFFICIAL: Sensitive and PROTECTED systems
      are a minimum of 6 characters.'
  ISM-1562:
    guideline: Video conferencing and Internet Protocol telephony
    section: Video conferencing and Internet Protocol telephony infrastructure hardening
    statement: Video conferencing and IP telephony infrastructure is hardened.
  ISM-1563:
    guideline: System-specific cyber security documentation
    section: Security assessment report
    statement: 'At the conclusion of a security control assessment for a system, a security assessment report is produced
      by the assessor and covers:


      - the scope of the security control assessment

      - the system’s strengths and weaknesses

      - security risks associated with the operation of the system

      - the effectiveness of the implementation of security controls

      - any recommended remediation actions.'
  ISM-1564:
    guideline: System-specific cyber security documentation
    section: Plan of action and milestones
    statement: At the conclusion of a security control assessment for a system, a plan of action and milestones is produced
      by the system owner.
  ISM-1565:
    guideline: Cyber security awareness training
    section: Providing cyber security awareness training
    statement: Tailored privileged user training is undertaken annually by all personnel with privileged access to systems
      and their resources.
  ISM-1566:
    guideline: Identity and access management
    section: Unprivileged access to systems
    statement: Use of unprivileged access is centrally logged.
  ISM-1567:
    guideline: Cyber supply chain risk management
    section: Cyber supply chain risk management activities
    statement: Suppliers identified as high risk by a cyber supply chain risk assessment are not used.
  ISM-1568:
    guideline: Cyber supply chain risk management
    section: Cyber supply chain risk management activities
    statement: Operating systems, applications, IT equipment, OT equipment and services are procured from suppliers that have
      demonstrated a commitment to the security of their products and services.
  ISM-1569:
    guideline: Cyber supply chain risk management
    section: Cyber supply chain risk management activities
    statement: A shared responsibility model is created, documented and shared between suppliers and their customers to articulate
      the security responsibilities of each party.
  ISM-1570:
    guideline: Managed services and cloud services
    section: Assessment of outsourced cloud service providers
    statement: 'Outsourced cloud service providers and their non-classified, OFFICIAL: Sensitive, PROTECTED and SECRET cloud
      services undergo an IRAP assessment, using the latest release of the ISM available prior to the beginning of the IRAP
      assessment (or a subsequent release), at least every 24 months.'
  ISM-1571:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: The right to verify compliance with security requirements is documented in contractual arrangements with service
      providers.
  ISM-1572:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: The regions or availability zones where data will be processed, stored and communicated, as well as a minimum
      notification period for any configuration changes, is documented in contractual arrangements with service providers.
  ISM-1573:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: Access to all logs relating to an organisation’s data and services is documented in contractual arrangements
      with service providers.
  ISM-1574:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: The storage of data in a portable manner that enables backups, service migration and service decommissioning
      without any loss of data is documented in contractual arrangements with service providers.
  ISM-1575:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: A minimum notification period of one month for the cessation of any services by a service provider is documented
      in contractual arrangements with service providers.
  ISM-1576:
    guideline: Managed services and cloud services
    section: Access to systems by service providers
    statement: If an organisation’s systems are accessed or administered by a service provider in an unauthorised manner,
      it is treated as a cyber security incident and the organisation is immediately notified.
  ISM-1577:
    guideline: Network design and configuration
    section: Network segmentation and segregation
    statement: An organisation’s networks are segregated from their service providers’ networks.
  ISM-1579:
    guideline: Service continuity for online services
    section: Capacity and availability planning and monitoring for online services
    statement: Cloud service providers’ ability to scale resources dynamically in response to genuine spikes in demand is
      discussed and verified as part of capacity and availability planning for online services.
  ISM-1580:
    guideline: Service continuity for online services
    section: Capacity and availability planning and monitoring for online services
    statement: Where a high availability requirement exists for online services, the services are architected to automatically
      transition between availability zones.
  ISM-1581:
    guideline: Service continuity for online services
    section: Capacity and availability planning and monitoring for online services
    statement: Continuous real-time monitoring of the capacity and availability of online services is performed.
  ISM-1582:
    guideline: Operating system hardening
    section: Application control
    statement: Application control rulesets are validated at least annually.
    essential_eight:
    - ML2
    - ML3
  ISM-1583:
    guideline: Identity and access management
    section: User identification
    statement: Personnel who are contractors are identified as such.
  ISM-1584:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Unprivileged users are prevented from bypassing, disabling or modifying security functionality of operating
      systems.
  ISM-1585:
    guideline: User application hardening
    section: Web browsers
    statement: Web browser security settings cannot be changed by human users.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1586:
    guideline: Data transfers
    section: Monitoring data import and export
    statement: Data transfer logs are used to record all data imports and exports from systems.
  ISM-1587:
    guideline: System owners
    section: Annual reporting of system security status
    statement: System owners report the security status of each system to its authorising officer at least annually.
  ISM-1588:
    guideline: Operating system hardening
    section: Standard operating environments
    statement: SOEs are reviewed and updated at least annually.
  ISM-1589:
    guideline: Email gateways and servers
    section: Email server transport encryption
    statement: MTA-STS is enabled to prevent the unencrypted transfer of emails between email servers.
  ISM-1590:
    guideline: Credential management
    section: Changing credentials
    statement: 'Credentials for user accounts are changed if:


      - they are compromised or suspected of being compromised

      - they are discovered stored on systems in the clear

      - they are discovered being transferred across networks in the clear

      - membership of a shared user account changes.'
  ISM-1591:
    guideline: Identity and access management
    section: Suspension of access to systems
    statement: Access to systems and their resources are removed or suspended as soon as practicable when users are detected
      undertaking malicious activities.
  ISM-1592:
    guideline: Operating system hardening
    section: Application management
    statement: Unprivileged human users do not have the ability to install unapproved applications.
  ISM-1593:
    guideline: Credential management
    section: Setting credentials for user accounts
    statement: Human users provide sufficient evidence to verify their identity when first requesting credentials, when requesting
      the reset of any credentials, when requesting the temporary disabling of any credentials, and when requesting the enrolment
      or re-enrolment of any credentials.
  ISM-1594:
    guideline: Credential management
    section: Setting credentials for user accounts
    statement: Credentials for human users are provided via a secure communications channel or, if not possible, split into
      two parts with one part provided to the human user and the other part provided to their supervisor.
  ISM-1595:
    guideline: Credential management
    section: Setting credentials for user accounts
    statement: Credentials provided to human users are changed on first use.
  ISM-1596:
    guideline: Credential management
    section: Setting credentials for user accounts
    statement: Credentials are not reused by users across different systems.
  ISM-1597:
    guideline: Credential management
    section: Protecting credentials
    statement: Credentials are obscured as they are entered into systems.
  ISM-1598:
    guideline: IT equipment maintenance or repairs
    section: Inspection of IT equipment following maintenance or repairs
    statement: Following maintenance or repairs to IT equipment, it is inspected to confirm that it retains its approved configuration
      and that no unauthorised modifications have been made.
  ISM-1599:
    guideline: IT equipment usage
    section: Handling IT equipment
    statement: IT equipment is handled in a manner suitable for its sensitivity or classification.
  ISM-1600:
    guideline: Media usage
    section: Sanitising media before first use
    statement: Media is sanitised before it is used for the first time.
  ISM-1601:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Microsoft’s attack surface reduction rules are implemented.
  ISM-1602:
    guideline: Development and maintenance of cyber security documentation
    section: Communication of cyber security documentation
    statement: Cyber security documentation, including notification of subsequent changes, is communicated to all stakeholders.
  ISM-1603:
    guideline: Identity and access management
    section: Insecure authentication methods
    statement: Authentication methods susceptible to replay attacks are disabled.
  ISM-1604:
    guideline: Virtualisation hardening
    section: Functional separation between operating environments
    statement: When using a software-based isolation mechanism that consumes shared physical computing resources, the configuration
      of the isolation mechanism is hardened by removing unneeded functionality and restricting access to the administrative
      interface used to manage the isolation mechanism.
  ISM-1605:
    guideline: Virtualisation hardening
    section: Functional separation between operating environments
    statement: When using a software-based isolation mechanism that consumes shared physical computing resources, the underlying
      operating system is hardened.
  ISM-1606:
    guideline: Virtualisation hardening
    section: Functional separation between operating environments
    statement: When using a software-based isolation mechanism that consumes shared physical computing resources, patches,
      updates or vendor mitigations for vulnerabilities are applied to the isolation mechanism and underlying operating system
      in a timely manner.
  ISM-1607:
    guideline: Virtualisation hardening
    section: Functional separation between operating environments
    statement: When using a software-based isolation mechanism that consumes shared physical resources, integrity monitoring
      and centralised event logging is performed for the isolation mechanism and underlying operating system.
  ISM-1608:
    guideline: Operating system hardening
    section: Standard operating environments
    statement: SOEs provided by third parties are scanned for malicious code and configurations.
  ISM-1609:
    guideline: Responding to cyber security incidents
    section: Handling and containing intrusions
    statement: System owners are consulted before allowing intrusion activity to continue on a system for the purpose of collecting
      further data or evidence.
  ISM-1610:
    guideline: Identity and access management
    section: Emergency access to systems
    statement: A method of emergency access to systems and their resources is documented and tested at least once when initially
      implemented and each time fundamental information technology infrastructure changes occur.
  ISM-1611:
    guideline: Identity and access management
    section: Emergency access to systems
    statement: Break glass accounts are only used when normal authentication processes cannot be used.
  ISM-1612:
    guideline: Identity and access management
    section: Emergency access to systems
    statement: Break glass accounts are only used for specific authorised activities.
  ISM-1613:
    guideline: Identity and access management
    section: Emergency access to systems
    statement: Use of break glass accounts is centrally logged.
  ISM-1614:
    guideline: Identity and access management
    section: Emergency access to systems
    statement: Break glass account credentials are changed by the account custodian after they are accessed by any other party.
  ISM-1615:
    guideline: Identity and access management
    section: Emergency access to systems
    statement: Break glass accounts are tested after credentials are changed.
  ISM-1616:
    guideline: Software development fundamentals
    section: Vulnerability disclosure program
    statement: A vulnerability disclosure program is implemented to assist with the secure development and maintenance of
      products and services.
  ISM-1617:
    guideline: Chief information security officer
    section: Overseeing the cyber security program
    statement: The CISO regularly reviews and updates their organisation’s cyber security program to ensure its relevance
      in addressing cyber threats and harnessing business and cyber security opportunities.
  ISM-1618:
    guideline: Chief information security officer
    section: Overseeing cyber security incident response activities
    statement: The CISO oversees their organisation’s response to cyber security incidents.
  ISM-1619:
    guideline: Credential management
    section: Setting credentials for built-in Administrator accounts, break glass accounts, local administrator accounts and
      service accounts
    statement: Service accounts are created as group Managed Service Accounts.
  ISM-1620:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services security group memberships
    statement: Privileged user accounts are members of the Protected Users security group.
  ISM-1621:
    guideline: Operating system hardening
    section: PowerShell
    statement: Windows PowerShell 2.0 is disabled or removed.
    essential_eight:
    - ML3
  ISM-1622:
    guideline: Operating system hardening
    section: PowerShell
    statement: PowerShell is configured to use Constrained Language Mode.
    essential_eight:
    - ML3
  ISM-1623:
    guideline: Operating system hardening
    section: PowerShell
    statement: PowerShell module logging, script block logging and transcription events are centrally logged.
    essential_eight:
    - ML2
    - ML3
  ISM-1624:
    guideline: Operating system hardening
    section: PowerShell
    statement: PowerShell script block logs are protected by Protected Event Logging functionality.
  ISM-1625:
    guideline: Managing cyber security incidents
    section: Insider threat mitigation program
    statement: An insider threat mitigation program is developed, implemented and maintained.
  ISM-1626:
    guideline: Managing cyber security incidents
    section: Insider threat mitigation program
    statement: Legal advice is sought regarding the development and implementation of an insider threat mitigation program.
  ISM-1627:
    guideline: Network design and configuration
    section: Blocking anonymity network traffic
    statement: Inbound network connections from anonymity networks are blocked.
  ISM-1628:
    guideline: Network design and configuration
    section: Blocking anonymity network traffic
    statement: Outbound network connections to anonymity networks are blocked.
  ISM-1629:
    guideline: Cryptographic algorithms
    section: Using Diffie-Hellman
    statement: When using DH for agreeing on encryption session keys, a modulus and associated parameters are selected according
      to NIST SP 800-56A Rev. 3.
  ISM-1631:
    guideline: Cyber supply chain risk management
    section: Cyber supply chain risk management activities
    statement: Suppliers of operating systems, applications, IT equipment, OT equipment and services associated with systems
      are identified.
  ISM-1632:
    guideline: Cyber supply chain risk management
    section: Cyber supply chain risk management activities
    statement: Operating systems, applications, IT equipment, OT equipment and services are procured from suppliers that have
      a strong track record of maintaining the security of their own systems.
  ISM-1633:
    guideline: System owners
    section: Protecting systems and their resources
    statement: System owners, in consultation with each system’s authorising officer, determine the system boundary, business
      criticality, and security and resilience objectives for each system based on an assessment of the impact if it were
      to be compromised or attacked.
  ISM-1634:
    guideline: System owners
    section: Protecting systems and their resources
    statement: System owners, in consultation with each system’s authorising officer, select security controls for each system
      and tailor them to achieve desired security and resilience objectives.
  ISM-1635:
    guideline: System owners
    section: Protecting systems and their resources
    statement: System owners implement security controls for each system and its operating environment.
  ISM-1636:
    guideline: System owners
    section: Protecting systems and their resources
    statement: 'System owners, in consultation with each system’s authorising officer, ensure security controls for each non-classified,
      OFFICIAL: Sensitive, PROTECTED and SECRET system and its operating environment undergo a security control assessment
      by their organisation’s own assessors or Infosec Registered Assessor Program (IRAP) assessors to determine if they have
      been implemented correctly and are operating as intended.'
  ISM-1637:
    guideline: Managed services and cloud services
    section: Outsourced cloud services
    statement: An outsourced cloud service register is developed, implemented, maintained and regularly verified.
  ISM-1638:
    guideline: Managed services and cloud services
    section: Outsourced cloud services
    statement: 'An outsourced cloud service register contains the following for each outsourced cloud service:


      - cloud service provider’s name

      - cloud service’s name

      - purpose for using the cloud service

      - sensitivity or classification of data involved

      - due date for the next security control assessment of the cloud service

      - contractual arrangements for the cloud service

      - organisational point of contact for the cloud service

      - 24/7 contact details for the cloud service provider.'
  ISM-1639:
    guideline: Cabling infrastructure
    section: Labelling building management cables
    statement: Building management cables are labelled with their purpose in black writing on a yellow background, with a
      minimum size of 2.5 cm x 1 cm, and attached at five-metre intervals.
  ISM-1640:
    guideline: Cabling infrastructure
    section: Labelling cables for foreign systems in Australian facilities
    statement: Cables for foreign systems installed in Australian facilities are labelled at inspection points.
  ISM-1641:
    guideline: Media destruction
    section: Degaussing magnetic media
    statement: Following the use of a degausser, magnetic media is physically damaged by deforming any internal platters.
  ISM-1642:
    guideline: Media usage
    section: Sanitising media before first use
    statement: Media is sanitised before it is reused in a different security domain.
  ISM-1643:
    guideline: System administration
    section: Software registers
    statement: Software registers contain versions and patch histories of applications, drivers, operating systems and firmware.
  ISM-1644:
    guideline: Mobile device usage
    section: Using mobile devices in public spaces
    statement: Sensitive or classified phone calls and conversations are not conducted in public locations unless care is
      taken to reduce the chance of conversations being overheard.
  ISM-1645:
    guideline: Cabling infrastructure
    section: Floor plan diagrams
    statement: Floor plan diagrams are developed, implemented, maintained and regularly verified.
  ISM-1646:
    guideline: Cabling infrastructure
    section: Floor plan diagrams
    statement: 'Floor plan diagrams contain the following:


      - cable paths (including ingress and egress points between floors)

      - cable reticulation system and conduit paths

      - floor concentration boxes

      - wall outlet boxes

      - network cabinets.'
  ISM-1647:
    guideline: Identity and access management
    section: Suspension of access to systems
    statement: Privileged access to systems and their resources are disabled after 12 months unless revalidated.
    essential_eight:
    - ML2
    - ML3
  ISM-1648:
    guideline: Identity and access management
    section: Suspension of access to systems
    statement: Privileged access to systems and their resources are disabled after 45 days of inactivity.
    essential_eight:
    - ML2
    - ML3
  ISM-1649:
    guideline: Identity and access management
    section: Privileged access to systems
    statement: Just-in-time administration is used for the administration of systems and their resources.
    essential_eight:
    - ML3
  ISM-1650:
    guideline: Identity and access management
    section: Privileged access to systems
    statement: Privileged user account and security group management events are centrally logged.
    essential_eight:
    - ML2
    - ML3
  ISM-1654:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Internet Explorer 11 is disabled or removed.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1655:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: .NET Framework 3.5 (includes .NET 2.0 and 3.0) is disabled or removed.
    essential_eight:
    - ML3
  ISM-1656:
    guideline: Operating system hardening
    section: Application control
    statement: Application control is implemented on non-internet-facing servers.
    essential_eight:
    - ML3
  ISM-1657:
    guideline: Operating system hardening
    section: Application control
    statement: Application control restricts the execution of executables, libraries, scripts, installers, compiled HTML,
      HTML applications and control panel applets to an organisation-approved set.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1658:
    guideline: Operating system hardening
    section: Application control
    statement: Application control restricts the execution of drivers to an organisation-approved set.
    essential_eight:
    - ML3
  ISM-1659:
    guideline: Operating system hardening
    section: Application control
    statement: Microsoft’s vulnerable driver blocklist is implemented.
    essential_eight:
    - ML3
  ISM-1660:
    guideline: Operating system hardening
    section: Application control
    statement: Allowed and blocked application control events are centrally logged.
    essential_eight:
    - ML2
    - ML3
  ISM-1667:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office is blocked from creating child processes.
    essential_eight:
    - ML2
    - ML3
  ISM-1668:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office is blocked from creating executable content.
    essential_eight:
    - ML2
    - ML3
  ISM-1669:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office is blocked from injecting code into other processes.
    essential_eight:
    - ML2
    - ML3
  ISM-1670:
    guideline: User application hardening
    section: Portable Document Format applications
    statement: PDF applications are blocked from creating child processes.
    essential_eight:
    - ML2
    - ML3
  ISM-1671:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office macros are disabled for human users that do not have a demonstrated business requirement.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1672:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office macro antivirus scanning is enabled.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1673:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office macros are blocked from making Win32 API calls.
    essential_eight:
    - ML2
    - ML3
  ISM-1674:
    guideline: User application hardening
    section: Office productivity suites
    statement: Only Microsoft Office macros running from within a sandboxed environment, a Trusted Location or that are digitally
      signed by a trusted publisher are allowed to execute.
    essential_eight:
    - ML3
  ISM-1675:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office macros digitally signed by an untrusted publisher cannot be enabled via the Message Bar or
      Backstage View.
    essential_eight:
    - ML3
  ISM-1676:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office’s list of trusted publishers is validated at least annually.
    essential_eight:
    - ML3
  ISM-1679:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication is used to authenticate human users to third-party online services that process,
      store or communicate their organisation’s sensitive data.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1680:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication (where available) is used to authenticate human users to third-party online services
      that process, store or communicate their organisation’s non-sensitive data.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1681:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication is used to authenticate customers to online customer services that process, store
      or communicate sensitive customer data.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1682:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication used for authenticating human users of systems is phishing-resistant.
    essential_eight:
    - ML2
    - ML3
  ISM-1683:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Successful and unsuccessful multi-factor authentication events are centrally logged.
    essential_eight:
    - ML2
    - ML3
  ISM-1685:
    guideline: Credential management
    section: Setting credentials for built-in Administrator accounts, break glass accounts, local administrator accounts and
      service accounts
    statement: Credentials for break glass accounts, local administrator accounts and service accounts are long, unique, unpredictable
      and managed.
    essential_eight:
    - ML2
    - ML3
  ISM-1686:
    guideline: Credential management
    section: Protecting credentials
    statement: Credential Guard functionality is enabled.
    essential_eight:
    - ML3
  ISM-1687:
    guideline: System administration
    section: Separate privileged operating environments
    statement: Privileged operating environments are not virtualised within unprivileged operating environments.
    essential_eight:
    - ML2
    - ML3
  ISM-1688:
    guideline: System administration
    section: Separate privileged operating environments
    statement: Unprivileged user accounts cannot be used to log on to privileged operating environments.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1689:
    guideline: System administration
    section: Separate privileged operating environments
    statement: Privileged user accounts (excluding local administrator accounts) cannot be used to log on to unprivileged
      operating environments.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1690:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in online services are applied within two
      weeks of release when vulnerabilities are assessed as non-critical by vendors and no working exploits exist.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1691:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in office productivity suites, web browsers
      and their extensions, email clients, PDF applications, and security products are applied within two weeks of release.
    essential_eight:
    - ML1
    - ML2
  ISM-1692:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in office productivity suites, web browsers
      and their extensions, email clients, PDF applications, and security products are applied within 48 hours of release
      when vulnerabilities are assessed as critical by vendors or when working exploits exist.
    essential_eight:
    - ML3
  ISM-1693:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in applications other than office productivity
      suites, web browsers and their extensions, email clients, PDF applications, and security products are applied within
      one month of release.
    essential_eight:
    - ML2
    - ML3
  ISM-1694:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in operating systems of internet-facing servers
      and internet-facing network devices are applied within two weeks of release when vulnerabilities are assessed as non-critical
      by vendors and no working exploits exist.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1695:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in operating systems of workstations, non-internet-facing
      servers and non-internet-facing network devices are applied within one month of release.
    essential_eight:
    - ML1
    - ML2
  ISM-1696:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in operating systems of workstations, non-internet-facing
      servers and non-internet-facing network devices are applied within 48 hours of release when vulnerabilities are assessed
      as critical by vendors or when working exploits exist.
    essential_eight:
    - ML3
  ISM-1697:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in drivers are applied within one month of
      release when vulnerabilities are assessed as non-critical by vendors and no working exploits exist.
    essential_eight:
    - ML3
  ISM-1698:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: A vulnerability scanner is used at least daily to identify missing patches or updates for vulnerabilities in
      online services.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1699:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: A vulnerability scanner is used at least weekly to identify missing patches or updates for vulnerabilities
      in office productivity suites, web browsers and their extensions, email clients, PDF applications, and security products.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1700:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: A vulnerability scanner is used at least fortnightly to identify missing patches or updates for vulnerabilities
      in applications other than office productivity suites, web browsers and their extensions, email clients, PDF applications,
      and security products.
    essential_eight:
    - ML2
    - ML3
  ISM-1701:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: A vulnerability scanner is used at least daily to identify missing patches or updates for vulnerabilities in
      operating systems of internet-facing servers and internet-facing network devices.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1702:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: A vulnerability scanner is used at least fortnightly to identify missing patches or updates for vulnerabilities
      in operating systems of workstations, non-internet-facing servers and non-internet-facing network devices.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1703:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: A vulnerability scanner is used at least fortnightly to identify missing patches or updates for vulnerabilities
      in drivers.
    essential_eight:
    - ML3
  ISM-1704:
    guideline: System maintenance
    section: Cessation of support
    statement: Office productivity suites, web browsers and their extensions, email clients, PDF applications, Adobe Flash
      Player, and security products that are no longer supported by vendors are removed.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1705:
    guideline: Data backup and restoration
    section: Backup access
    statement: Privileged user accounts (excluding backup administrator accounts) cannot access backups belonging to other
      user accounts.
    essential_eight:
    - ML2
    - ML3
  ISM-1706:
    guideline: Data backup and restoration
    section: Backup access
    statement: Privileged user accounts (excluding backup administrator accounts) cannot access their own backups.
    essential_eight:
    - ML3
  ISM-1707:
    guideline: Data backup and restoration
    section: Backup modification and deletion
    statement: Privileged user accounts (excluding backup administrator accounts) are prevented from modifying and deleting
      backups.
    essential_eight:
    - ML2
    - ML3
  ISM-1708:
    guideline: Data backup and restoration
    section: Backup modification and deletion
    statement: Backup administrator accounts are prevented from modifying and deleting backups during their retention period.
    essential_eight:
    - ML3
  ISM-1710:
    guideline: Wireless networks
    section: Default settings
    statement: Settings for wireless access points are hardened.
  ISM-1711:
    guideline: Network design and configuration
    section: 802.1X authentication and key exchange
    statement: User identity confidentiality is used if available with EAP-TLS implementations.
  ISM-1712:
    guideline: Wireless networks
    section: Fast Basic Service Set Transition
    statement: The use of FT (802.11r) is disabled unless authenticator-to-authenticator communications are secured by an
      ASD-Approved Cryptographic Protocol.
  ISM-1713:
    guideline: Media usage
    section: Removable media register
    statement: A removable media register is developed, implemented, maintained and regularly verified.
  ISM-1717:
    guideline: Software development fundamentals
    section: Vulnerability disclosure program
    statement: A ‘security.txt’ file is hosted for each of an organisation’s internet-facing website domains to assist in
      the responsible disclosure of vulnerabilities in the organisation’s products and services.
  ISM-1722:
    guideline: Media destruction
    section: Media destruction methods
    statement: Electrostatic memory devices are destroyed using a furnace/incinerator, hammer mill, disintegrator or grinder/sander.
  ISM-1723:
    guideline: Media destruction
    section: Media destruction methods
    statement: Magnetic floppy disks are destroyed using a furnace/incinerator, hammer mill, disintegrator, degausser or by
      cutting.
  ISM-1724:
    guideline: Media destruction
    section: Media destruction methods
    statement: Magnetic hard disks are destroyed using a furnace/incinerator, hammer mill, disintegrator, grinder/sander or
      degausser.
  ISM-1725:
    guideline: Media destruction
    section: Media destruction methods
    statement: Magnetic tapes are destroyed using a furnace/incinerator, hammer mill, disintegrator, degausser or by cutting.
  ISM-1726:
    guideline: Media destruction
    section: Media destruction methods
    statement: Optical disks are destroyed using a furnace/incinerator, hammer mill, disintegrator, grinder/sander or by cutting.
  ISM-1727:
    guideline: Media destruction
    section: Media destruction methods
    statement: Semiconductor memory is destroyed using a furnace/incinerator, hammer mill or disintegrator.
  ISM-1730:
    guideline: Software development fundamentals
    section: Software bill of materials
    statement: A software bill of materials is produced and made available to consumers of software.
  ISM-1731:
    guideline: Responding to cyber security incidents
    section: Handling and containing intrusions
    statement: Planning and coordination of intrusion remediation activities are conducted using trusted systems separate
      from a compromised system.
  ISM-1732:
    guideline: Responding to cyber security incidents
    section: Handling and containing intrusions
    statement: Intrusion remediation activities are coordinated and sequenced to minimise opportunities for re-compromise
      of a system while balancing operational risk and business continuity requirements.
  ISM-1735:
    guideline: Media sanitisation
    section: Media that cannot be successfully sanitised
    statement: Media that cannot be successfully sanitised is destroyed prior to its disposal.
  ISM-1736:
    guideline: Managed services and cloud services
    section: Managed services
    statement: A managed service register is developed, implemented, maintained and regularly verified.
  ISM-1737:
    guideline: Managed services and cloud services
    section: Managed services
    statement: 'A managed service register contains the following for each managed service:


      - managed service provider’s name

      - managed service’s name

      - purpose for using the managed service

      - sensitivity or classification of data involved

      - due date for the next security control assessment of the managed service

      - contractual arrangements for the managed service

      - organisational point of contact for the managed service

      - 24/7 contact details for the managed service provider.'
  ISM-1738:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: The right to verify compliance with security requirements documented in contractual arrangements with service
      providers is regularly exercised.
  ISM-1739:
    guideline: Development and maintenance of cyber security documentation
    section: Approval of cyber security documentation
    statement: A system’s security architecture is approved prior to the development of the system.
  ISM-1740:
    guideline: Cyber security awareness training
    section: Managing requests to change banking details or transfer funds
    statement: Personnel dealing with banking details and payment requests are advised of what business email compromise is
      and how to manage and report it.
  ISM-1741:
    guideline: IT equipment sanitisation and destruction
    section: IT equipment destruction processes and procedures
    statement: IT equipment destruction processes, and supporting IT equipment destruction procedures, are developed, implemented
      and maintained.
  ISM-1742:
    guideline: IT equipment sanitisation and destruction
    section: Sanitising IT equipment
    statement: IT equipment that cannot be sanitised is destroyed.
  ISM-1743:
    guideline: Operating system hardening
    section: Operating system selection
    statement: Vendors that have demonstrated a commitment to Secure by Design and Secure by Default principles and practices,
      including secure programming practices and either memory-safe programming languages or less preferably memory-safe programming
      practices, are used for operating systems.
  ISM-1745:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Early Launch Antimalware, Secure Boot, Trusted Boot and Measured Boot functionality is enabled.
  ISM-1746:
    guideline: Operating system hardening
    section: Application control
    statement: When implementing application control using path rules, only approved users can change file system permissions
      for approved files and folders.
  ISM-1748:
    guideline: User application hardening
    section: Email clients
    statement: Email client security settings cannot be changed by human users.
  ISM-1749:
    guideline: Credential management
    section: Protecting credentials
    statement: Cached credentials are limited to one previous logon.
  ISM-1750:
    guideline: System administration
    section: Administrative infrastructure
    statement: Administrative infrastructure for critical servers, high-value servers and regular servers is segregated from
      each other.
  ISM-1751:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in operating systems of IT equipment other
      than workstations, servers and network devices are applied within one month of release when vulnerabilities are assessed
      as non-critical by vendors and no working exploits exist.
  ISM-1752:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: A vulnerability scanner is used at least fortnightly to identify missing patches or updates for vulnerabilities
      in operating systems of IT equipment other than workstations, servers and network devices.
  ISM-1753:
    guideline: System maintenance
    section: Cessation of support
    statement: Internet-facing network devices that are no longer supported by vendors are replaced.
  ISM-1754:
    guideline: Software development fundamentals
    section: Reporting and resolving vulnerabilities
    statement: Vulnerabilities identified in software are resolved in a timely manner.
  ISM-1755:
    guideline: Software development fundamentals
    section: Vulnerability disclosure program
    statement: A vulnerability disclosure policy is developed, implemented and maintained.
  ISM-1756:
    guideline: Software development fundamentals
    section: Vulnerability disclosure program
    statement: Vulnerability disclosure processes, and supporting vulnerability disclosure procedures, are developed, implemented
      and maintained.
  ISM-1766:
    guideline: Cryptographic algorithms
    section: Using Secure Hashing Algorithms
    statement: When using SHA-2 for hashing, an output size of at least 224 bits is used, preferably SHA-384 or SHA-512.
  ISM-1769:
    guideline: Cryptographic algorithms
    section: Using symmetric cryptographic algorithms
    statement: When using AES for encryption, AES-128, AES-192 or AES-256 is used, preferably AES-256.
  ISM-1771:
    guideline: Internet Protocol Security
    section: Encryption algorithms
    statement: AES is used for encrypting IPsec connections, preferably ENCR_AES_GCM_16.
  ISM-1772:
    guideline: Internet Protocol Security
    section: Pseudorandom function
    statement: PRF_HMAC_SHA2_256, PRF_HMAC_SHA2_384 or PRF_HMAC_SHA2_512 is used for IPsec connections, preferably PRF_HMAC_SHA2_512.
  ISM-1774:
    guideline: Gateways
    section: System administration of gateways
    statement: Gateways are managed via a secure path isolated from all connected networks.
  ISM-1778:
    guideline: Data transfers
    section: Manual import of data
    statement: When manually importing data to systems, all data that fails security checks is quarantined until reviewed
      and subsequently approved or not approved for release.
  ISM-1779:
    guideline: Data transfers
    section: Manual export of data
    statement: When manually exporting data from systems, all data that fails security checks is quarantined until reviewed
      and subsequently approved or not approved for release.
  ISM-1780:
    guideline: Software development fundamentals
    section: Secure software development
    statement: SecDevOps practices are used for software development.
  ISM-1781:
    guideline: Network design and configuration
    section: Network encryption
    statement: All data communicated over network infrastructure is encrypted using ASD-approved cryptography.
  ISM-1782:
    guideline: Network design and configuration
    section: Protective Domain Name System Services
    statement: A protective DNS service is used to block access to known malicious domain names.
  ISM-1783:
    guideline: Gateways
    section: Border Gateway Protocol routing security
    statement: Public IP addresses controlled by, or used by, an organisation are signed by valid ROA records.
  ISM-1784:
    guideline: Managing cyber security incidents
    section: Cyber security incident management policy
    statement: The cyber security incident management policy, including the associated cyber security incident response plan,
      is exercised at least annually.
  ISM-1785:
    guideline: Cyber supply chain risk management
    section: Supplier relationship management
    statement: A supplier relationship management policy is developed, implemented and maintained.
  ISM-1786:
    guideline: Cyber supply chain risk management
    section: Supplier relationship management
    statement: An approved supplier list is developed, implemented and maintained.
  ISM-1787:
    guideline: Cyber supply chain risk management
    section: Sourcing operating systems, applications, IT equipment, OT equipment and services
    statement: Operating systems, applications, IT equipment, OT equipment and services are sourced from approved suppliers.
  ISM-1788:
    guideline: Cyber supply chain risk management
    section: Sourcing operating systems, applications, IT equipment, OT equipment and services
    statement: Multiple potential suppliers are identified for sourcing critical operating systems, applications, IT equipment,
      OT equipment and services.
  ISM-1789:
    guideline: Cyber supply chain risk management
    section: Sourcing operating systems, applications, IT equipment, OT equipment and services
    statement: Sufficient spares of critical IT equipment and OT equipment are sourced and kept in reserve.
  ISM-1790:
    guideline: Cyber supply chain risk management
    section: Delivery of operating systems, applications, IT equipment, OT equipment and services
    statement: Operating systems, applications, IT equipment, OT equipment and services are delivered in a manner that maintains
      their integrity.
  ISM-1791:
    guideline: Cyber supply chain risk management
    section: Delivery of operating systems, applications, IT equipment, OT equipment and services
    statement: The integrity of operating systems, applications, IT equipment, OT equipment and services are assessed as part
      of acceptance of products and services.
  ISM-1792:
    guideline: Cyber supply chain risk management
    section: Delivery of operating systems, applications, IT equipment, OT equipment and services
    statement: The authenticity of operating systems, applications, IT equipment, OT equipment and services are assessed as
      part of acceptance of products and services.
  ISM-1793:
    guideline: Managed services and cloud services
    section: Assessment of managed service providers
    statement: 'Managed service providers and their non-classified, OFFICIAL: Sensitive, PROTECTED and SECRET managed services
      undergo an Infosec Registered Assessor Program (IRAP) assessment, using the latest release of the ISM available prior
      to the beginning of the IRAP assessment (or a subsequent release), at least every 24 months.'
  ISM-1794:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: A minimum notification period of one month by service providers for significant changes to their own service
      provider arrangements is documented in contractual arrangements with service providers.
  ISM-1795:
    guideline: Credential management
    section: Setting credentials for built-in Administrator accounts, break glass accounts, local administrator accounts and
      service accounts
    statement: Credentials for built-in Administrator accounts, break glass accounts, local administrator accounts and service
      accounts are a minimum of 30 characters.
  ISM-1796:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Files containing executable content are digitally signed by a certificate with a verifiable chain of trust
      as part of software development.
  ISM-1797:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Installers, patches and updates are digitally signed or provided with cryptographic checksums as part of software
      development.
  ISM-1798:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Secure configuration guidance, in the form of a hardening guide or loosening guide, is produced and made available
      to consumers as part of software development.
  ISM-1799:
    guideline: Email gateways and servers
    section: Domain-based Message Authentication, Reporting and Conformance
    statement: Incoming emails are rejected if they do not pass DMARC checks.
  ISM-1800:
    guideline: Network design and configuration
    section: Network device integrity
    statement: Network devices are flashed with trusted firmware before they are used for the first time.
  ISM-1801:
    guideline: Network design and configuration
    section: Regularly restarting network devices
    statement: Network devices are restarted at least monthly.
  ISM-1803:
    guideline: Managing cyber security incidents
    section: Cyber security incident register
    statement: 'A cyber security incident register contains the following for each cyber security incident:


      - the date the cyber security incident occurred

      - the date the cyber security incident was discovered

      - a description of the cyber security incident

      - any actions taken in response to the cyber security incident

      - to whom the cyber security incident was reported.'
  ISM-1804:
    guideline: Managed services and cloud services
    section: Contractual security requirements with service providers
    statement: Break clauses associated with failure to meet security requirements are documented in contractual arrangements
      with service providers.
  ISM-1805:
    guideline: Video conferencing and Internet Protocol telephony
    section: Denial of service response plan
    statement: 'A denial of service response plan for video conferencing and IP telephony services contains the following:


      - how to identify signs of a denial-of-service attack

      - how to identify the source of a denial-of-service attack

      - how capabilities can be maintained during a denial-of-service attack

      - what actions can be taken to respond to a denial-of-service attack.'
  ISM-1806:
    guideline: User application hardening
    section: Hardening user application configurations
    statement: Default user accounts or credentials for user applications, including for any pre-configured user accounts,
      are changed, disabled or removed during initial setup.
  ISM-1807:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: An automated method of asset discovery is used at least fortnightly to support the detection of assets for
      subsequent vulnerability scanning activities.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1808:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: A vulnerability scanner with an up-to-date vulnerability database is used for vulnerability scanning activities.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1809:
    guideline: System maintenance
    section: Cessation of support
    statement: When applications, operating systems, network devices or networked IT equipment that are no longer supported
      by vendors cannot be immediately removed or replaced, compensating security controls are implemented until such time
      that they can be removed or replaced.
  ISM-1810:
    guideline: Data backup and restoration
    section: Performing and retaining backups
    statement: Backups of data, applications and settings are synchronised to enable restoration to a common point in time.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1811:
    guideline: Data backup and restoration
    section: Performing and retaining backups
    statement: Backups of data, applications and settings are retained in a secure and resilient manner.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1812:
    guideline: Data backup and restoration
    section: Backup access
    statement: Unprivileged user accounts cannot access backups belonging to other user accounts.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1813:
    guideline: Data backup and restoration
    section: Backup access
    statement: Unprivileged user accounts cannot access their own backups.
    essential_eight:
    - ML3
  ISM-1814:
    guideline: Data backup and restoration
    section: Backup modification and deletion
    statement: Unprivileged user accounts are prevented from modifying and deleting backups.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1815:
    guideline: Security monitoring
    section: Centralised event logging facility
    statement: Event logs are protected from unauthorised modification and deletion.
    essential_eight:
    - ML2
    - ML3
  ISM-1816:
    guideline: Software development fundamentals
    section: Authoritative source for software
    statement: Unauthorised modification of the authoritative source for software is prevented.
  ISM-1817:
    guideline: Software development fundamentals
    section: Network application programming interfaces
    statement: Authentication and authorisation of clients is performed when clients call network APIs that facilitate access
      to data not authorised for release into the public domain and are accessible over the internet.
  ISM-1818:
    guideline: Software development fundamentals
    section: Network application programming interfaces
    statement: Authentication and authorisation of clients is performed when clients call network APIs that facilitate modification
      of data and are accessible over the internet.
  ISM-1819:
    guideline: Responding to cyber security incidents
    section: Enacting cyber security incident response plans
    statement: Following the identification of a cyber security incident, the cyber security incident response plan is enacted.
    essential_eight:
    - ML2
    - ML3
  ISM-1820:
    guideline: Cabling infrastructure
    section: Cable colours
    statement: Cables for individual systems use a consistent colour.
  ISM-1822:
    guideline: Cabling infrastructure
    section: Wall outlet box colours
    statement: Wall outlet boxes for individual systems use a consistent colour.
  ISM-1823:
    guideline: User application hardening
    section: Office productivity suites
    statement: Office productivity suite security settings cannot be changed by human users.
    essential_eight:
    - ML2
    - ML3
  ISM-1824:
    guideline: User application hardening
    section: Portable Document Format applications
    statement: PDF application security settings cannot be changed by human users.
    essential_eight:
    - ML2
    - ML3
  ISM-1825:
    guideline: User application hardening
    section: Security products
    statement: Security product security settings cannot be changed by human users.
  ISM-1826:
    guideline: Server application hardening
    section: Server application selection
    statement: Vendors that have demonstrated a commitment to Secure by Design and Secure by Default principles and practices,
      including secure programming practices and either memory-safe programming languages or less preferably memory-safe programming
      practices, are used for server applications.
  ISM-1827:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services
    statement: Microsoft AD DS domain controllers are administered using dedicated domain administrator user accounts that
      are not used to administer other systems.
  ISM-1828:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services
    statement: The Print Spooler service is disabled on Microsoft AD DS domain controllers.
  ISM-1829:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services
    statement: Passwords are not stored in Group Policy Preferences.
  ISM-1830:
    guideline: Server application hardening
    section: Microsoft Active Directory services
    statement: Security-relevant events for Microsoft AD DS domain controllers, Microsoft AD CS servers, Microsoft AD FS servers
      and Microsoft Entra Connect servers are centrally logged.
  ISM-1832:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: Only service accounts and computer accounts are configured with Service Principal Names (SPNs).
  ISM-1833:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: User accounts are provisioned with the minimum privileges required.
  ISM-1834:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: Duplicate SPNs do not exist within the domain.
  ISM-1835:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: Privileged user accounts are configured as sensitive and cannot be delegated.
  ISM-1836:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: User accounts require Kerberos pre-authentication.
  ISM-1838:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: The UserPassword attribute for user accounts is not used.
  ISM-1839:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: Account properties accessible by unprivileged users are not used to store passwords.
  ISM-1840:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: User account passwords do not use reversible encryption.
  ISM-1841:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: Unprivileged user accounts cannot add machines to the domain.
  ISM-1842:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: Dedicated privileged service accounts are used to add machines to the domain.
  ISM-1843:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: User accounts with unconstrained delegation are reviewed at least annually, and those without an SPN or demonstrated
      business requirement are removed.
  ISM-1844:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: Computer accounts that are not Microsoft AD DS domain controllers are not trusted for delegation to services.
  ISM-1845:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services security group memberships
    statement: When a user account is disabled, it is removed from all security group memberships.
  ISM-1846:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services security group memberships
    statement: The Pre-Windows 2000 Compatible Access security group does not contain user accounts.
  ISM-1847:
    guideline: Credential management
    section: Changing credentials
    statement: Credentials for the Kerberos Key Distribution Center’s service account (KRBTGT) are changed twice, allowing
      for replication to all Microsoft AD DS domain controllers in-between each change, if the domain has been directly compromised,
      the domain is suspected of being compromised or they have not been changed in the past six months.
  ISM-1848:
    guideline: Virtualisation hardening
    section: Functional separation between operating environments
    statement: When using a software-based isolation mechanism that consumes shared physical computing resources, the isolation
      mechanism or underlying operating system is replaced when it is no longer supported by a vendor.
  ISM-1849:
    guideline: Web application development
    section: Secure web application design and development
    statement: The OWASP Top 10 Proactive Controls are used in the development of web applications.
  ISM-1850:
    guideline: Web application development
    section: Secure web application design and development
    statement: The OWASP Top 10 are mitigated in the development of web applications.
  ISM-1851:
    guideline: Web application development
    section: Web application programming interfaces
    statement: The OWASP API Security Top 10 are mitigated in the development of web APIs.
  ISM-1852:
    guideline: Identity and access management
    section: Unprivileged access to systems
    statement: Unprivileged access to systems and their resources is limited to only what is required for users to undertake
      their duties or functions.
  ISM-1854:
    guideline: Multifunction devices
    section: Authenticating to multifunction devices
    statement: Human users authenticate to MFDs before they can print, scan or copy documents.
  ISM-1855:
    guideline: Multifunction devices
    section: Logging multifunction device use
    statement: Use of MFDs for printing, scanning and copying purposes, including the capture of shadow copies of documents,
      are centrally logged.
  ISM-1858:
    guideline: IT equipment usage
    section: Hardening IT equipment configurations
    statement: IT equipment is hardened using ASD and vendor hardening guidance, with the most restrictive guidance taking
      precedence when conflicts occur.
  ISM-1859:
    guideline: User application hardening
    section: Office productivity suites
    statement: Office productivity suites are hardened using ASD and vendor hardening guidance, with the most restrictive
      guidance taking precedence when conflicts occur.
    essential_eight:
    - ML2
    - ML3
  ISM-1860:
    guideline: User application hardening
    section: Portable Document Format applications
    statement: PDF applications are hardened using ASD and vendor hardening guidance, with the most restrictive guidance taking
      precedence when conflicts occur.
    essential_eight:
    - ML2
    - ML3
  ISM-1861:
    guideline: Credential management
    section: Protecting credentials
    statement: Local Security Authority protection functionality is enabled.
    essential_eight:
    - ML3
  ISM-1862:
    guideline: Web application firewalls
    section: Using web application firewalls
    statement: If using a WAF, disclosing the IP addresses of web servers under an organisation’s control (referred to as
      origin servers) is avoided and access to the origin servers is restricted to the WAF and authorised management networks.
  ISM-1863:
    guideline: Network design and configuration
    section: Networked management interfaces
    statement: Networked management interfaces for IT equipment are not directly exposed to the internet.
  ISM-1864:
    guideline: Identity and access management
    section: System usage policy
    statement: A system usage policy is developed, implemented and maintained.
  ISM-1865:
    guideline: Identity and access management
    section: System access requirements
    statement: Personnel agree to abide by system usage policies before being granted access to systems and their resources.
  ISM-1866:
    guideline: Enterprise mobility
    section: Privately owned mobile devices and desktop computers
    statement: 'Personnel using privately owned mobile devices or desktop computers to access OFFICIAL: Sensitive or PROTECTED
      systems or data are prevented from storing classified data on their privately owned mobile devices and desktop computers.'
  ISM-1867:
    guideline: Mobile device management
    section: Approved mobile platforms
    statement: 'Mobile devices that access OFFICIAL: Sensitive or PROTECTED systems or data use mobile platforms that have
      completed a Common Criteria evaluation against the Protection Profile for Mobile Device Fundamentals, version 3.3 or
      later, and are operated in accordance with the latest version of their associated ASD security configuration guide.'
  ISM-1869:
    guideline: IT equipment usage
    section: IT equipment registers
    statement: A non-networked IT equipment register is developed, implemented, maintained and regularly verified.
  ISM-1870:
    guideline: Operating system hardening
    section: Application control
    statement: Application control is applied to user profiles and temporary folders used by operating systems, web browsers
      and email clients.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1871:
    guideline: Operating system hardening
    section: Application control
    statement: Application control is applied to all locations other than user profiles and temporary folders used by operating
      systems, web browsers and email clients.
    essential_eight:
    - ML2
    - ML3
  ISM-1872:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication used for authenticating human users of online services is phishing-resistant.
    essential_eight:
    - ML2
    - ML3
  ISM-1873:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication used for authenticating customers of online customer services provides a phishing-resistant
      option.
    essential_eight:
    - ML2
  ISM-1874:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication used for authenticating customers of online customer services is phishing-resistant.
    essential_eight:
    - ML3
  ISM-1875:
    guideline: Credential management
    section: Protecting credentials
    statement: Systems are scanned at least monthly to identify any credentials that are being stored in the clear.
  ISM-1876:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in online services are applied within 48 hours
      of release when vulnerabilities are assessed as critical by vendors or when working exploits exist.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1877:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in operating systems of internet-facing servers
      and internet-facing network devices are applied within 48 hours of release when vulnerabilities are assessed as critical
      by vendors or when working exploits exist.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1878:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in operating systems of IT equipment other
      than workstations, servers and network devices are applied within 48 hours of release when vulnerabilities are assessed
      as critical by vendors or when working exploits exist.
  ISM-1879:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in drivers are applied within 48 hours of
      release when vulnerabilities are assessed as critical by vendors or when working exploits exist.
    essential_eight:
    - ML3
  ISM-1880:
    guideline: Managing cyber security incidents
    section: Reporting cyber security incidents to customers and the public
    statement: Cyber security incidents that involve customer data are reported to customers and the public in a timely manner
      after they occur or are discovered.
  ISM-1881:
    guideline: Managing cyber security incidents
    section: Reporting cyber security incidents to customers and the public
    statement: Cyber security incidents that do not involve customer data are reported to customers and the public in a timely
      manner after they occur or are discovered.
  ISM-1882:
    guideline: Cyber supply chain risk management
    section: Cyber supply chain risk management activities
    statement: Operating systems, applications, IT equipment, OT equipment and services are procured from suppliers that have
      demonstrated a commitment to transparency for their products and services.
  ISM-1883:
    guideline: Identity and access management
    section: Privileged access to systems
    statement: Privileged user accounts explicitly authorised to access online services are strictly limited to only what
      is required for users to undertake their duties or functions.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1884:
    guideline: Emanation security
    section: Emanation security doctrine
    statement: Emanation security doctrine produced by ASD for the management of emanation security matters is complied with.
  ISM-1886:
    guideline: Mobile device management
    section: Maintaining mobile device security
    statement: Mobile devices are configured to operate in a supervised (or equivalent) mode.
  ISM-1887:
    guideline: Mobile device management
    section: Maintaining mobile device security
    statement: Mobile devices are configured with remote locate and wipe functionality.
  ISM-1888:
    guideline: Mobile device management
    section: Maintaining mobile device security
    statement: Mobile devices are configured with secure password-based lock screens.
  ISM-1889:
    guideline: Operating system hardening
    section: Command Shell
    statement: Command line process creation events are centrally logged.
    essential_eight:
    - ML2
    - ML3
  ISM-1890:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office macros are checked to ensure they are free of malicious code before being digitally signed
      or placed within Trusted Locations.
    essential_eight:
    - ML3
  ISM-1891:
    guideline: User application hardening
    section: Office productivity suites
    statement: Microsoft Office macros digitally signed by signatures other than V3 signatures cannot be enabled via the Message
      Bar or Backstage View.
    essential_eight:
    - ML3
  ISM-1892:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication is used to authenticate human users to their organisation’s online customer services
      that process, store or communicate their organisation’s sensitive customer data.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1893:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication is used to authenticate human users to third-party online customer services that
      process, store or communicate their organisation’s sensitive customer data.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1894:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: Multi-factor authentication used for authenticating human users of data repositories is phishing-resistant.
    essential_eight:
    - ML3
  ISM-1895:
    guideline: Identity and access management
    section: Single-factor authentication
    statement: Successful and unsuccessful single-factor authentication events are centrally logged.
  ISM-1896:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Memory integrity functionality is enabled.
    essential_eight:
    - ML3
  ISM-1897:
    guideline: Credential management
    section: Protecting credentials
    statement: Remote Credential Guard functionality is enabled.
    essential_eight:
    - ML3
  ISM-1898:
    guideline: System administration
    section: Separate privileged operating environments
    statement: Secure Admin Workstations are used in the performance of administrative activities.
    essential_eight:
    - ML3
  ISM-1899:
    guideline: System administration
    section: Administrative infrastructure
    statement: Network devices that do not belong to administrative infrastructure cannot initiate connections with administrative
      infrastructure.
  ISM-1900:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: A vulnerability scanner is used at least fortnightly to identify missing patches or updates for vulnerabilities
      in firmware.
    essential_eight:
    - ML3
  ISM-1901:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in office productivity suites, web browsers
      and their extensions, email clients, PDF applications, and security products are applied within two weeks of release
      when vulnerabilities are assessed as non-critical by vendors and no working exploits exist.
    essential_eight:
    - ML3
  ISM-1902:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in operating systems of workstations, non-internet-facing
      servers and non-internet-facing network devices are applied within one month of release when vulnerabilities are assessed
      as non-critical by vendors and no working exploits exist.
    essential_eight:
    - ML3
  ISM-1903:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in firmware are applied within 48 hours of
      release when vulnerabilities are assessed as critical by vendors or when working exploits exist.
    essential_eight:
    - ML3
  ISM-1904:
    guideline: System maintenance
    section: Mitigating known vulnerabilities
    statement: Patches, updates or other vendor mitigations for vulnerabilities in firmware are applied within one month of
      release when vulnerabilities are assessed as non-critical by vendors and no working exploits exist.
    essential_eight:
    - ML3
  ISM-1905:
    guideline: System maintenance
    section: Cessation of support
    statement: Online services that are no longer supported by vendors are removed.
    essential_eight:
    - ML1
    - ML2
    - ML3
  ISM-1906:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Event logs from internet-facing servers are analysed in a timely manner to detect cyber security events.
    essential_eight:
    - ML2
    - ML3
  ISM-1907:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Event logs from non-internet-facing servers are analysed in a timely manner to detect cyber security events.
    essential_eight:
    - ML3
  ISM-1908:
    guideline: Software development fundamentals
    section: Reporting and resolving vulnerabilities
    statement: Vulnerabilities identified in software are publicly disclosed in a responsible and timely manner, including
      with Common Weakness Enumeration and Common Platform Enumeration information.
  ISM-1909:
    guideline: Software development fundamentals
    section: Reporting and resolving vulnerabilities
    statement: In resolving vulnerabilities, root cause analysis is performed and, to the greatest extent possible, entire
      vulnerability classes are remediated.
  ISM-1910:
    guideline: Software development fundamentals
    section: Network application programming interfaces
    statement: Network API calls that facilitate modification of data, or access to data not authorised for release into the
      public domain, and are accessible over the internet, are centrally logged.
  ISM-1911:
    guideline: Software development fundamentals
    section: Software event logging
    statement: Security-relevant usage, error messages and crashes for software are centrally logged.
  ISM-1912:
    guideline: Network design and configuration
    section: Network documentation
    statement: Network documentation includes device settings for all critical servers, high-value servers, network devices
      and network security appliances.
  ISM-1913:
    guideline: IT equipment usage
    section: Hardening IT equipment configurations
    statement: Approved configurations for IT equipment are developed, implemented and maintained.
  ISM-1914:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Approved configurations for operating systems are developed, implemented and maintained.
  ISM-1915:
    guideline: User application hardening
    section: Hardening user application configurations
    statement: Approved configurations for user applications are developed, implemented and maintained.
  ISM-1916:
    guideline: Server application hardening
    section: Hardening server application configurations
    statement: Approved configurations for server applications are developed, implemented and maintained.
  ISM-1917:
    guideline: Cryptographic algorithms
    section: Transitioning to post-quantum cryptography
    statement: The development and procurement of new cryptographic equipment, applications and libraries ensures support
      for the use of ML-DSA-87, ML-KEM-1024, SHA-384, SHA-512 and AES-256 by no later than 2030.
  ISM-1918:
    guideline: Chief information security officer
    section: Reporting on cyber security
    statement: The CISO regularly reports directly to their organisation’s audit, risk and compliance committee (or equivalent)
      on cyber security matters.
  ISM-1919:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: When multi-factor authentication is used to authenticate human users or customers to online services or online
      customer services, all other authentication protocols that do not support multi-factor authentication are disabled.
  ISM-1920:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: When multi-factor authentication is used to authenticate human users to online services, online customer services,
      systems or data repositories – that process, store or communicate their organisation’s sensitive data or sensitive customer
      data – human users are prevented from self-enrolling into multi-factor authentication from untrustworthy devices.
  ISM-1921:
    guideline: Security assessments
    section: Vulnerability scanning
    statement: The likelihood of system compromise is frequently assessed when working exploits exist for unmitigated vulnerabilities.
  ISM-1922:
    guideline: Mobile application development
    section: Secure mobile application development
    statement: The OWASP Mobile Application Security Verification Standard is used in the development of mobile applications.
  ISM-1924:
    guideline: Artificial intelligence application development
    section: Prompt injection
    statement: Generative AI applications evaluate user prompts to detect and mitigate adversarial inputs or suffixes designed
      to elicit unintended behaviour or assist in the generation of sensitive or harmful content.
  ISM-1926:
    guideline: Server application hardening
    section: Microsoft Active Directory services
    statement: Microsoft AD DS domain controllers, Microsoft AD CS servers, Microsoft AD FS servers and Microsoft Entra Connect
      servers are only used for their designed role and no other applications or services are installed, unless they are security
      related.
  ISM-1927:
    guideline: Server application hardening
    section: Microsoft Active Directory services
    statement: Access to Microsoft AD DS domain controllers, Microsoft AD CS servers, Microsoft AD FS servers and Microsoft
      Entra Connect servers is limited to privileged users that require access.
  ISM-1928:
    guideline: Server application hardening
    section: Microsoft Active Directory services
    statement: Backups of Microsoft AD DS domain controllers, Microsoft AD CS servers, Microsoft AD FS servers and Microsoft
      Entra Connect servers are encrypted using ASD-approved cryptography, stored securely and only accessible to backup administrator
      accounts.
  ISM-1929:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services
    statement: Lightweight Directory Access Protocol signing is enabled on Microsoft AD DS domain controllers.
  ISM-1930:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services
    statement: Passwords are prevented from being stored in Group Policy Preferences.
  ISM-1931:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services
    statement: SID Filtering is enabled for domain and forest trusts.
  ISM-1932:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: The number of service accounts configured with an SPN is minimised.
  ISM-1933:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: Service accounts configured with an SPN do not have DCSync permissions.
  ISM-1934:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: User accounts with DCSync permissions are reviewed at least every six months, and those without an ongoing
      requirement for the permissions have them removed.
  ISM-1935:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: Computer accounts are not configured for unconstrained delegation.
  ISM-1936:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: The sIDHistory attribute for user accounts is not used.
  ISM-1937:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: User accounts are checked at least weekly for the presence of the sIDHistory attribute.
  ISM-1938:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: The Domain Computers security group does not have write or modify permissions to any Microsoft Active Directory
      objects.
  ISM-1939:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services security group memberships
    statement: The number of user accounts that are members of the Domain Admins, Enterprise Admins or other highly privileged
      security groups is minimised.
  ISM-1940:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services security group memberships
    statement: Service accounts are not members of the Domain Admins, Enterprise Admins or other highly privileged security
      groups.
  ISM-1941:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services security group memberships
    statement: Computer accounts are not members of the Domain Admins, Enterprise Admins or other highly privileged security
      groups.
  ISM-1942:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services security group memberships
    statement: The Domain Computers security group is not a member of any privileged or highly privileged security groups.
  ISM-1943:
    guideline: Server application hardening
    section: Microsoft Active Directory Certificate Services
    statement: Strong mapping between certificates and users is enforced.
  ISM-1944:
    guideline: Server application hardening
    section: Microsoft Active Directory Certificate Services
    statement: The EDITF_ATTRIBUTESUBJECTALTNAME2 flag is removed from Microsoft AD CS certification authority configurations.
  ISM-1945:
    guideline: Server application hardening
    section: Microsoft Active Directory Certificate Services
    statement: The CT_FLAG_ENROLLEE_SUPPLIES_SUBJECT flag is removed from certificate templates.
  ISM-1946:
    guideline: Server application hardening
    section: Microsoft Active Directory Certificate Services
    statement: Unprivileged user accounts do not have write access to certificate templates.
  ISM-1947:
    guideline: Server application hardening
    section: Microsoft Active Directory Certificate Services
    statement: Extended Key Usages that enable user authentication are removed.
  ISM-1948:
    guideline: Server application hardening
    section: Microsoft Active Directory Certificate Services
    statement: Certificate manager approval is required for certificate templates that allow a Subject Alternative Name to
      be supplied.
  ISM-1949:
    guideline: Server application hardening
    section: Microsoft Active Directory Federation Services
    statement: Microsoft AD FS servers are administered using a dedicated service account that is not used to administer other
      systems.
  ISM-1950:
    guideline: Server application hardening
    section: Microsoft Entra Connect
    statement: Soft matching between Microsoft AD DS and Microsoft Entra ID is disabled following initial synchronisation
      activities.
  ISM-1951:
    guideline: Server application hardening
    section: Microsoft Entra Connect
    statement: Hard match takeover is disabled for Microsoft Entra Connect servers.
  ISM-1952:
    guideline: Server application hardening
    section: Microsoft Entra Connect
    statement: Privileged user accounts are not synchronised between Microsoft AD DS and Microsoft Entra ID.
  ISM-1953:
    guideline: Credential management
    section: Setting credentials for built-in Administrator accounts, break glass accounts, local administrator accounts and
      service accounts
    statement: Credentials for the built-in Administrator account in each domain are long, unique, unpredictable and managed.
  ISM-1954:
    guideline: Credential management
    section: Setting credentials for built-in Administrator accounts, break glass accounts, local administrator accounts and
      service accounts
    statement: Credentials for built-in Administrator accounts, break glass accounts, local administrator accounts and service
      accounts are randomly generated.
  ISM-1955:
    guideline: Credential management
    section: Changing credentials
    statement: Credentials for computer accounts are changed if they are compromised, they are suspected of being compromised
      or they have not been changed in the past 30 days.
  ISM-1956:
    guideline: Credential management
    section: Changing credentials
    statement: Microsoft AD FS token-signing and encryption certificates are changed twice in quick succession if they are
      compromised, they are suspected of being compromised or they have not been changed in the past 12 months.
  ISM-1957:
    guideline: Credential management
    section: Protecting credentials
    statement: Private keys for Microsoft AD CS certification authority servers are protected by a hardware security module.
  ISM-1958:
    guideline: System administration
    section: Separate privileged operating environments
    statement: User accounts with DCSync permissions cannot be used to log on to unprivileged operating environments.
  ISM-1959:
    guideline: Security monitoring
    section: Event log details
    statement: To the extent possible, event logs are captured and stored in a consistent and structured format.
  ISM-1960:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Event logs from internet-facing network devices are analysed in a timely manner to detect cyber security events.
  ISM-1961:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Event logs from non-internet-facing network devices are analysed in a timely manner to detect cyber security
      events.
  ISM-1962:
    guideline: Network design and configuration
    section: Using the Server Message Block protocol
    statement: SMB version 1 is not used on networks.
  ISM-1963:
    guideline: Network design and configuration
    section: Network device event logging
    statement: Security-relevant events for internet-facing network devices are centrally logged.
  ISM-1964:
    guideline: Network design and configuration
    section: Network device event logging
    statement: Security-relevant events for non-internet-facing network devices are centrally logged.
  ISM-1965:
    guideline: Content filtering
    section: Content checking
    statement: Files imported or exported via gateways or CDSs undergo content checking.
  ISM-1966:
    guideline: Chief information security officer
    section: Overseeing the cyber security program
    statement: The CISO develops, implements, maintains and regularly verifies a register of systems used by their organisation.
  ISM-1969:
    guideline: Responding to cyber security incidents
    section: Handling and containing malicious code infections
    statement: Malicious code, when stored or communicated, is treated beforehand to prevent accidental execution.
  ISM-1970:
    guideline: Responding to cyber security incidents
    section: Handling and containing malicious code infections
    statement: Malicious code processing for cyber security incident response or research purposes is conducted in a dedicated
      analysis environment segregated from other systems.
  ISM-1976:
    guideline: Operating system hardening
    section: Operating system event logging
    statement: Security-relevant events for Apple macOS operating systems are centrally logged.
  ISM-1977:
    guideline: Operating system hardening
    section: Operating system event logging
    statement: Security-relevant events for Linux operating systems are centrally logged.
  ISM-1978:
    guideline: Server application hardening
    section: Server application event logging
    statement: Security-relevant events for server applications on internet-facing servers are centrally logged.
  ISM-1979:
    guideline: Server application hardening
    section: Server application event logging
    statement: Security-relevant events for server applications on non-internet-facing servers are centrally logged.
  ISM-1980:
    guideline: Credential management
    section: Protecting credentials
    statement: Credential hint functionality is not used for systems.
  ISM-1981:
    guideline: System maintenance
    section: Cessation of support
    statement: Non-internet-facing network devices that are no longer supported by vendors are replaced.
  ISM-1982:
    guideline: System maintenance
    section: Cessation of support
    statement: Networked IT equipment that is no longer supported by vendors is replaced.
  ISM-1983:
    guideline: Security monitoring
    section: Centralised event logging facility
    statement: Event logs sent to a centralised event logging facility are sent as soon as possible after they occur.
  ISM-1984:
    guideline: Security monitoring
    section: Centralised event logging facility
    statement: Event logs sent to a centralised event logging facility are encrypted in transit using Australian Signals Directorate
      (ASD)-approved cryptography.
  ISM-1985:
    guideline: Security monitoring
    section: Centralised event logging facility
    statement: Event logs are protected from unauthorised access.
  ISM-1986:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Event logs from critical servers are analysed in a timely manner to detect cyber security events.
  ISM-1987:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Event logs from security products are analysed in a timely manner to detect cyber security events.
  ISM-1988:
    guideline: Security monitoring
    section: Event log retention
    statement: Event logs are retained in a searchable manner for at least 12 months.
  ISM-1989:
    guideline: Security monitoring
    section: Event log retention
    statement: Event logs are retained as per minimum retention requirements for various classes of records as set out by
      the National Archives of Australia’s Administrative Functions Disposal Authority Express (AFDA Express) Version 2 publication.
  ISM-1990:
    guideline: Cryptographic algorithms
    section: Using post-quantum cryptographic algorithms
    statement: When using ML-DSA and ML-KEM, as per FIPS 204 and FIPS 203 respectively, adherence to pre-requisite FIPS 140-3
      validation is preferred.
  ISM-1991:
    guideline: Cryptographic algorithms
    section: Using the Module-Lattice-Based Digital Signature Algorithm
    statement: When using ML-DSA for digital signatures, ML-DSA-65 or ML-DSA-87 is used, preferably ML-DSA-87.
  ISM-1992:
    guideline: Cryptographic algorithms
    section: Using the Module-Lattice-Based Digital Signature Algorithm
    statement: When using ML-DSA for digital signatures, the hedged variant is used whenever possible.
  ISM-1993:
    guideline: Cryptographic algorithms
    section: Using the Module-Lattice-Based Digital Signature Algorithm
    statement: Pre-hashed variants of ML-DSA-65 and ML-DSA-87 are only used when the performance of default variants is unacceptable.
  ISM-1994:
    guideline: Cryptographic algorithms
    section: Using the Module-Lattice-Based Digital Signature Algorithm
    statement: When the pre-hashed variants of ML-DSA-65 and ML-DSA-87 are used, at least SHA-384 and SHA-512 respectively
      are used for pre-hashing.
  ISM-1995:
    guideline: Cryptographic algorithms
    section: Using the Module-Lattice-Based Key Encapsulation Mechanism
    statement: When using ML-KEM for encapsulating encryption session keys (and similar keys), ML-KEM-768 or ML-KEM-1024 is
      used, preferably ML-KEM-1024.
  ISM-1996:
    guideline: Cryptographic algorithms
    section: Post-quantum traditional hybrid schemes
    statement: When a post-quantum traditional hybrid scheme is used, either the post-quantum cryptographic algorithm, the
      traditional cryptographic algorithm or both are AACAs.
  ISM-1997:
    guideline: Board of directors and executive committee
    section: Embedding cyber security
    statement: The board of directors or executive committee defines clear roles and responsibilities for cyber security both
      within the board of directors or executive committee and broadly within their organisation.
  ISM-1998:
    guideline: Board of directors and executive committee
    section: Embedding cyber security
    statement: The board of directors or executive committee ensures that cyber security is integrated throughout all business
      functions within their organisation.
  ISM-1999:
    guideline: Board of directors and executive committee
    section: Embedding cyber security
    statement: The board of directors or executive committee ensures the cyber security strategy for their organisation is
      aligned with the overarching strategic direction and business strategy for their organisation.
  ISM-2000:
    guideline: Board of directors and executive committee
    section: Embedding cyber security
    statement: The board of directors or executive committee seeks regular briefings or reporting on the cyber security posture
      of their organisation, as well as the threat environment in which they operate, from internal and external subject matter
      experts.
  ISM-2001:
    guideline: Board of directors and executive committee
    section: Championing a positive cyber security culture
    statement: The board of directors or executive committee champions a positive cyber security culture within their organisation,
      including through leading by example.
  ISM-2002:
    guideline: Board of directors and executive committee
    section: Building cyber security expertise
    statement: The board of directors or executive committee maintains a sufficient level of cyber security literacy to fulfil
      both their fiduciary duties and any legislative or regulatory obligations.
  ISM-2003:
    guideline: Board of directors and executive committee
    section: Building cyber security expertise
    statement: The board of directors or executive committee maintains awareness of key cyber security recruitment activities,
      retention rates for cyber security personnel, and cyber security skills and experience gaps within their organisation.
  ISM-2004:
    guideline: Board of directors and executive committee
    section: Building cyber security expertise
    statement: The board of directors or executive committee supports the development of cyber security skills and experience
      for all personnel via internal and external cyber security awareness raising and training opportunities.
  ISM-2005:
    guideline: Board of directors and executive committee
    section: Identifying critical business assets
    statement: The board of directors or executive committee understands the business criticality of their organisation’s
      systems, including at least a basic understanding of what systems exist, their value, where they reside, who has access,
      who might seek access, how they are protected, and how that protection is verified.
  ISM-2006:
    guideline: Board of directors and executive committee
    section: Planning for major cyber security incidents
    statement: The board of directors or executive committee plans for major cyber security incidents, including by participating
      in exercises, and understands their duties in relation to such cyber security incidents.
  ISM-2010:
    guideline: Server application hardening
    section: Microsoft Active Directory Domain Services account hardening
    statement: Service accounts configured with an SPN use the Advanced Encryption Standard for encryption.
  ISM-2011:
    guideline: Identity and access management
    section: Multi-factor authentication
    statement: When phishing-resistant multi-factor authentication is used by human users, other non-phishing-resistant multi-factor
      authentication options are disabled for their user accounts.
  ISM-2012:
    guideline: Identity and access management
    section: Screen locking
    statement: 'Systems are configured with a screen lock that:


      - activates after a maximum of 15 minutes of human user inactivity, or when manually activated

      - conceals all content on the screen

      - ensures that the screen does not enter a power saving state before the screen lock is activated

      - requires re-authentication by human users using all authentication factors to unlock the system

      - denies human users the ability to disable the screen locking mechanism.'
  ISM-2013:
    guideline: Software development fundamentals
    section: Network application programming interfaces
    statement: Authentication and authorisation of clients is performed when clients call network APIs that facilitate modification
      of data but are not accessible over the internet.
  ISM-2014:
    guideline: Software development fundamentals
    section: Network application programming interfaces
    statement: Authentication and authorisation of clients is performed when clients call network APIs that facilitate access
      to data not authorised for release into the public domain but are not accessible over the internet.
  ISM-2015:
    guideline: Software development fundamentals
    section: Network application programming interfaces
    statement: Network API calls that facilitate modification of data, or access to data not authorised for release into the
      public domain, but are not accessible over the internet, are centrally logged.
  ISM-2016:
    guideline: Software development fundamentals
    section: Software input handling
    statement: Validation and sanitisation are performed on all input received over a local network by software.
  ISM-2017:
    guideline: Network design and configuration
    section: Encrypted Domain Name System Services
    statement: DNS traffic is encrypted by clients and servers using ASD-approved cryptography.
  ISM-2018:
    guideline: Gateways
    section: Border Gateway Protocol routing security
    statement: Routes for RPKI-registered IP addresses that are advertised from invalid Autonomous Systems, or that are longer
      than allowed, are rejected or deprioritised by routers that exchange routes via BGP.
  ISM-2020:
    guideline: Chief information security officer
    section: Overseeing cyber security personnel
    statement: The CISO ensures sufficient cyber security personnel, with the right skills and experience, are acquired to
      support cyber security activities within their organisation.
  ISM-2021:
    guideline: System owners
    section: Protecting systems and their resources
    statement: System owners implement and maintain data minimisation practices for each of their systems.
  ISM-2022:
    guideline: Cyber security awareness training
    section: Providing cyber security awareness training
    statement: A cyber security awareness training register is developed, implemented and maintained.
  ISM-2023:
    guideline: Software development fundamentals
    section: Authoritative source for software
    statement: An authoritative source for software is established and maintained.
  ISM-2024:
    guideline: Software development fundamentals
    section: Authoritative source for software
    statement: The authoritative source for software is used for all software development activities.
  ISM-2025:
    guideline: Software development fundamentals
    section: Issue tracking
    statement: An issue tracking solution is used to link software development tasks to security issues and decisions, change
      or feature requests, programming issues, or bug fixes.
  ISM-2026:
    guideline: Software development fundamentals
    section: Software artefacts
    statement: All software artefacts are scanned for malicious content before being imported into the authoritative source
      for software.
  ISM-2027:
    guideline: Software development fundamentals
    section: Software artefacts
    statement: All software artefacts are verified by a digital signature, or a secure hash provided over a secure channel,
      before being imported into the authoritative source for software.
  ISM-2028:
    guideline: Software development fundamentals
    section: Software artefacts
    statement: All software artefacts are tested to detect known weaknesses using static application security testing (SAST),
      dynamic application security testing (DAST) or software composition analysis (SCA), depending on the software artefact
      type, before being imported into the authoritative source for software.
  ISM-2029:
    guideline: Software development fundamentals
    section: Software artefacts
    statement: The authoritative source for software restricts the use and import of third-party libraries and software components
      to trustworthy sources.
  ISM-2030:
    guideline: Software development fundamentals
    section: Software artefacts
    statement: Scanning is used during commits to identify plain text or encoded credentials, keys and secrets, which are
      then blocked from being stored in the authoritative source for software.
  ISM-2031:
    guideline: Software development fundamentals
    section: Build solution
    statement: Compilers, interpreters and build tools (including pipelines) that provide security features to improve executable
      file security are implemented and such security features are used.
  ISM-2032:
    guideline: Software development fundamentals
    section: Build solution
    statement: The build solution ensures that all automated testing is completed without warnings, alerts or errors before
      building software artefacts.
  ISM-2033:
    guideline: Software development fundamentals
    section: Secure software development
    statement: All software security requirements are documented, stored securely and maintained throughout the software development
      life cycle.
  ISM-2034:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Security design decisions are documented and reviewed throughout the software development cycle.
  ISM-2035:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Security roles, responsibilities and knowledge required to support the software development life cycle are
      identified and documented.
  ISM-2036:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Security responsibilities for software developers are identified and documented.
  ISM-2037:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Software developers that lack sufficient cyber security knowledge and skills required for their projects or
      tasks undertake suitable training or upskilling on secure software development and programming practices.
  ISM-2038:
    guideline: Software development fundamentals
    section: Secure software development
    statement: A software developer cyber security knowledge and skills register is developed, implemented and maintained.
  ISM-2039:
    guideline: Software development fundamentals
    section: Secure software development
    statement: The software threat model is reviewed throughout the software development life cycle to ensure it reflects
      the as-built software and any changes to the threat environment.
  ISM-2040:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Secure programming practices for the chosen programming language are used for software development.
  ISM-2041:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Memory-safe programming languages, or less preferably memory-safe programming practices, are used for software
      development.
  ISM-2042:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Secure by Default principles and practices are followed throughout the software development life cycle, including
      by ensuring that all built-in security measures are included and enabled in the base product at no extra cost to consumers.
  ISM-2043:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Software is architected and structured to support readability and maintainability.
  ISM-2044:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Software has no default credentials; however, if credentials are required, they are created on first install
      by the installing organisation.
  ISM-2045:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Application backwards compatibility does not compromise any security measures or features.
  ISM-2046:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Where software allows user impersonation, sensitive data is not logged and appropriate permissions are set.
  ISM-2047:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Where software allows an authentication factor to be reset for a human user, the human user is notified of
      the reset through a secondary channel.
  ISM-2048:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Where software supports multiple user roles, non-administrative users are prevented from altering their profile
      permissions or privileges.
  ISM-2049:
    guideline: Software development fundamentals
    section: Secure software development
    statement: When user permissions or credentials are changed, software forces all impacted users to re-authenticate.
  ISM-2050:
    guideline: Software development fundamentals
    section: Secure software development
    statement: When digital signatures are processed by software, they are validated against a certificate trust chain and
      checked for revocation using a Certificate Revocation List or with the Online Certificate Status Protocol.
  ISM-2051:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Software generates sufficient event logs to support the detection of cyber security events.
  ISM-2052:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Event logs produced by software ensure that any sensitive data is protected.
  ISM-2053:
    guideline: Software development fundamentals
    section: Secure software development
    statement: End of life procedures for software, including procedures for software removal and the archival or destruction
      of user accounts and data, are produced and made available to consumers.
  ISM-2054:
    guideline: Software development fundamentals
    section: Software bill of materials
    statement: If a software bill of materials is available for imported third-party software components, it is used during
      software development to ensure such software components have no known vulnerabilities.
  ISM-2055:
    guideline: Software development fundamentals
    section: Software build provenance
    statement: If a software build provenance is available for imported third-party software components, it is used during
      software development to ensure such software components are built to an appropriate standard.
  ISM-2056:
    guideline: Software development fundamentals
    section: Software build provenance
    statement: A software build provenance is produced and made available to consumers of software.
  ISM-2057:
    guideline: Software development fundamentals
    section: Software input handling
    statement: All input validation rules are documented, implemented in code, and tested using both positive and negative
      unit tests and integration tests.
  ISM-2058:
    guideline: Software development fundamentals
    section: Software input handling
    statement: Data sources and serialised data inputs are validated before being deserialised.
  ISM-2059:
    guideline: Software development fundamentals
    section: Software input handling
    statement: File uploads or input are restricted to specific file types, with malicious content scanning occurring prior
      to file access, file execution or file storage.
  ISM-2060:
    guideline: Software development fundamentals
    section: Software security testing
    statement: Code reviews are utilised to ensure software components meets Secure by Design principles and practices as
      well as secure programming practices.
  ISM-2061:
    guideline: Software development fundamentals
    section: Software security testing
    statement: Peer reviews are conducted on all critical and security-related software components.
  ISM-2062:
    guideline: Software development fundamentals
    section: Software security testing
    statement: Unit testing and integration testing, covering both positive and negative use cases, are used for software
      components to ensure code quality and correctness.
  ISM-2063:
    guideline: Web application development
    section: Secure web application design and development
    statement: If supported, web application session cookies set the HttpOnly flag, Secure flag and the SameSite flag by default.
  ISM-2064:
    guideline: Web application development
    section: Secure web application design and development
    statement: Web application session cookies contain only digitally signed opaque bearer tokens.
  ISM-2065:
    guideline: Web application development
    section: Secure web application design and development
    statement: Web application session cookies using opaque bearer tokens that are not digitally signed use non-sequential
      random identifiers with a minimum of 128 bits of entropy, preferably 256 bits of entropy.
  ISM-2066:
    guideline: Web application development
    section: Secure web application design and development
    statement: Web application sessions are centrally managed server side.
  ISM-2067:
    guideline: Web application development
    section: Secure web application design and development
    statement: Web applications that support Single Sign On equally support Single Logout.
  ISM-2068:
    guideline: Network design and configuration
    section: Functional separation between networked devices and the internet
    statement: Internet connectivity for networked devices is strictly limited to those that require access.
  ISM-2071:
    guideline: Cyber security awareness training
    section: Managing requests to modify user accounts
    statement: Personnel dealing with user account details are advised of what social engineering attacks are, how to manage
      such situations and how to report them.
  ISM-2072:
    guideline: Artificial intelligence application development
    section: Secure artificial intelligence application development
    statement: AI models are stored in a non-executable file format that does not allow arbitrary code execution.
  ISM-2073:
    guideline: Cryptographic algorithms
    section: Transitioning to post-quantum cryptography
    statement: A post-quantum cryptography transition plan is developed, implemented and maintained.
  ISM-2074:
    guideline: Cyber security awareness training
    section: General-purpose artificial intelligence usage policy
    statement: A general-purpose AI usage policy is developed, implemented and maintained.
  ISM-2075:
    guideline: Fax machines and services
    section: Sending and receiving fax messages
    statement: Fax machines, and online fax services, are not used for sending or receiving fax messages.
  ISM-2076:
    guideline: Identity and access management
    section: Insecure authentication methods
    statement: Security questions are not used for authentication purposes.
  ISM-2077:
    guideline: Identity and access management
    section: Insecure authentication methods
    statement: Email is not used for out-of-band authentication purposes.
  ISM-2078:
    guideline: Credential management
    section: Password strength
    statement: Passwords appearing in lists of commonly used passwords or lists of compromised passwords are not used.
  ISM-2079:
    guideline: Credential management
    section: Password strength
    statement: Maximum length limits for passwords are not less than 64 characters.
  ISM-2080:
    guideline: Credential management
    section: Password strength
    statement: Password complexity requirements are not imposed for passwords.
  ISM-2081:
    guideline: Credential management
    section: Password strength
    statement: All ASCII printable characters are supported for passwords.
  ISM-2082:
    guideline: Software development fundamentals
    section: Cryptographic bill of materials
    statement: If a cryptographic bill of materials is available for imported third-party software components, it is used
      during software development to ensure such software components provide support for standardised implementations of ASD-Approved
      Cryptographic Algorithms.
  ISM-2083:
    guideline: Software development fundamentals
    section: Cryptographic bill of materials
    statement: A cryptographic bill of materials is produced and made available to consumers of software.
  ISM-2084:
    guideline: Artificial intelligence application development
    section: Secure artificial intelligence application development
    statement: AI-specific documentation, including AI model cards and AI system cards (or equivalent artefacts), is used
      to document AI model characteristics, system architectures, use cases and security risks.
  ISM-2085:
    guideline: Artificial intelligence application development
    section: Secure artificial intelligence application development
    statement: The exposure of exact AI model confidence scores in API outputs or user interfaces is prevented.
  ISM-2086:
    guideline: Artificial intelligence application development
    section: Artificial intelligence model poisoning
    statement: The source and integrity of AI models, structures and weights are verified.
  ISM-2087:
    guideline: Artificial intelligence application development
    section: Artificial intelligence model poisoning
    statement: The source and integrity of training data for AI models is verified.
  ISM-2088:
    guideline: Artificial intelligence application development
    section: Artificial intelligence model poisoning
    statement: Data validation and verification techniques are used to ensure the reliability and accuracy of training data
      used by AI models.
  ISM-2089:
    guideline: Artificial intelligence application development
    section: Unbounded consumption
    statement: AI model performance metrics are monitored and anomalies are investigated.
  ISM-2090:
    guideline: Artificial intelligence application development
    section: Unbounded consumption
    statement: Rate limiting is applied to inference queries for AI models.
  ISM-2091:
    guideline: Artificial intelligence application development
    section: Unbounded consumption
    statement: Resource limits are enforced for AI models.
  ISM-2092:
    guideline: Artificial intelligence application development
    section: Excessive agency
    statement: Access control policies are implemented to enforce fine-grained permissions for AI applications.
  ISM-2093:
    guideline: Artificial intelligence application development
    section: Excessive agency
    statement: Role-based access controls are implemented for AI applications to restrict access to sensitive data.
  ISM-2094:
    guideline: Artificial intelligence application development
    section: Sensitive data exposure and improper output
    statement: Content filtering is implemented by AI applications to detect and block sensitive data exposure and improper
      output.
  ISM-2095:
    guideline: Enterprise mobility
    section: Privately owned mobile devices and desktop computers
    statement: 'Personnel using privately owned mobile devices or desktop computers to access OFFICIAL: Sensitive or PROTECTED
      systems or data are disallowed from granting access to unapproved artificial intelligence agents.'
  ISM-2096:
    guideline: Mobile device management
    section: Maintaining mobile device security
    statement: Mobile devices are configured to enforce separation between organisational and personal mobile applications
      and data.
  ISM-2097:
    guideline: Mobile device management
    section: Maintaining mobile device security
    statement: Mobile devices are configured with always on VPN functionality.
  ISM-2098:
    guideline: Mobile device management
    section: Maintaining mobile device security
    statement: Mobile devices are configured to prevent data transfers over Universal Serial Bus connections.
  ISM-2099:
    guideline: Mobile device usage
    section: Connecting mobile devices to connected vehicles
    statement: Mobile devices are not connected to the infotainment systems of connected vehicles.
  ISM-2100:
    guideline: Mobile device usage
    section: Using mobile devices within or near connected vehicles
    statement: Sensitive or classified data is not viewed on mobile devices within or near connected vehicles.
  ISM-2101:
    guideline: Mobile device usage
    section: Using mobile devices within or near connected vehicles
    statement: Sensitive or classified phone calls and conversations are not conducted within or near connected vehicles.
  ISM-2102:
    guideline: Software development fundamentals
    section: Software artefacts
    statement: Existing software artefacts in the authoritative source for software are periodically tested to detect known
      weaknesses using SAST, DAST or SCA, depending on the software artefact type, throughout the software development life
      cycle.
  ISM-2103:
    guideline: Artificial intelligence application development
    section: Data collection, retention and use
    statement: Organisational data generated, collected or processed by AI applications is not used for training, fine-tuning
      or improving AI models unless informed and explicit consent has been obtained from data owners in advance.
  ISM-2104:
    guideline: Cyber security awareness training
    section: Posting work-related information on online services
    statement: Personnel are advised not to post information about their security clearance and briefings on unauthorised
      online services, and to report cases where such information is posted.
  ISM-2105:
    guideline: Cyber security awareness training
    section: Posting work-related information on online services
    statement: Personnel are advised to limit posting information about their work-related duties on unauthorised online services,
      and to report cases where such information is posted.
  ISM-2106:
    guideline: Cyber security awareness training
    section: Posting work-related information on online services
    statement: Personnel are advised to limit posting information about their work-related skills and experience on unauthorised
      online services, and to report cases where such information is posted.
  ISM-2107:
    guideline: Cyber security awareness training
    section: Posting personal information on online services
    statement: Personnel are encouraged to use any available privacy settings to restrict who can view personal information
      they post on online services.
  ISM-2108:
    guideline: Mobile device management
    section: Encrypted communications
    statement: Mobile applications encrypt all sensitive or classified data communicated over public network infrastructure
      using ASD-approved cryptography.
  ISM-2109:
    guideline: Media usage
    section: Encrypting media
    statement: Pre-boot authentication using passwords, or managed network-based key release, is implemented for media containing
      encrypted system volumes.
  ISM-2110:
    guideline: User application hardening
    section: Hardening user application configurations
    statement: User applications are hardened using ASD and vendor hardening guidance, with the most restrictive guidance
      taking precedence when conflicts occur.
  ISM-2111:
    guideline: User application hardening
    section: Hardening user application configurations
    statement: All temporary installation files created during user application installation processes are removed after user
      applications have been installed.
  ISM-2112:
    guideline: User application hardening
    section: Artificial intelligence applications
    statement: AI applications that process classified data have their ability to directly access external public data sources
      disabled.
  ISM-2113:
    guideline: User application hardening
    section: Artificial intelligence applications
    statement: AI applications are configured to require human approval before executing sensitive or high-impact actions.
  ISM-2114:
    guideline: User application hardening
    section: Artificial intelligence applications
    statement: Baselines of expected behaviour and performance for AI applications are established and monitored for unexpected
      deviations.
  ISM-2115:
    guideline: Server application hardening
    section: Hardening server application configurations
    statement: Extensions for server applications are restricted to an organisation-approved set.
  ISM-2116:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Cyber threat intelligence services are used to support the detection of cyber security events and the identification
      of cyber security incidents.
  ISM-2117:
    guideline: Security monitoring
    section: Event log monitoring
    statement: Suitable AI models are used to augment the detection of cyber security events and the identification of cyber
      security incidents.
  ISM-2118:
    guideline: Security assessments
    section: Vulnerability assessments and penetration tests
    statement: Vulnerability assessments and penetration tests are conducted for systems prior to their deployment, including
      prior to the deployment of significant changes, and at least every six months thereafter.
  ISM-2119:
    guideline: Security assessments
    section: Vulnerability assessments and penetration tests
    statement: Suitable AI models are used to augment vulnerability assessments and penetration tests.
  ISM-2120:
    guideline: Software development fundamentals
    section: Secure software development
    statement: A secure software development policy is developed, implemented and maintained.
  ISM-2121:
    guideline: Software development fundamentals
    section: Secure software development
    statement: Software developers that lack sufficient cyber security knowledge and skills required for their projects or
      tasks are not used.
  ISM-2122:
    guideline: Software development fundamentals
    section: Software security testing
    statement: Suitable AI models are used to augment software security testing.
  ISM-2123:
    guideline: Artificial intelligence application development
    section: Data collection, retention and use
    statement: All prompts and outputs associated with chat sessions are securely deleted when chat sessions are removed from
      AI applications.
  ISM-2124:
    guideline: Managed services and cloud services
    section: Access to systems by service providers
    statement: Access by a service provider to an organisation’s systems is restricted to remote management tools, source
      network addresses and time windows explicitly approved by the organisation.
  ISM-2125:
    guideline: Managed services and cloud services
    section: Access to systems by service providers
    statement: All access to an organisation’s systems by a service provider is independently logged by the organisation in
      a manner that the service provider cannot modify or delete, and analysed in a timely manner to detect any anomalous,
      unexpected or unauthorised activity.
  ISM-2126:
    guideline: Cyber security awareness training
    section: Synthetic impersonation
    statement: Personnel positively identify requestors using a pre-established authentication method or independent trusted
      communication channel before actioning requests to modify user account details, modify banking details or conduct financial
      transactions.
  ISM-2127:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: Digital signature verification functionality for drivers is enforced before they are loaded.
  ISM-2128:
    guideline: Operating system hardening
    section: Hardening operating system configurations
    statement: The ability to install, load or modify kernel-mode code, including drivers, kernel modules and extensions,
      is limited to privileged users who require such abilities as part of their duties or functions.
  ISM-2129:
    guideline: Operating system hardening
    section: Windows Management Instrumentation
    statement: WMI activity, including the creation of permanent event subscriptions, is centrally logged.
  ISM-2130:
    guideline: Server application hardening
    section: Microsoft Active Directory Certificate Services
    statement: Web-based enrolment interfaces for Microsoft AD CS servers are disabled unless required, and where enabled,
      are configured to require HTTPS and Extended Protection for Authentication.
  ISM-2131:
    guideline: Server application hardening
    section: Microsoft Active Directory Certificate Services
    statement: Certificate templates are reviewed at least every three months to identify and remediate misconfigurations
      that could enable privilege escalation or unauthorised certificate enrolment.
  ISM-2132:
    guideline: Server application hardening
    section: Microsoft Active Directory Certificate Services
    statement: Certificate enrolment events, including successful and unsuccessful requests and changes to certificate templates
      or Microsoft AD CS configurations, are centrally logged.
  ISM-2133:
    guideline: Identity and access management
    section: Artificial intelligence agent identification
    statement: Each AI agent is assigned a unique identity that is distinct from the user accounts of personnel and the identities
      of other AI agents.
  ISM-2134:
    guideline: Identity and access management
    section: Artificial intelligence agent register
    statement: An AI agent register is developed, implemented, maintained and regularly verified.
  ISM-2135:
    guideline: Identity and access management
    section: Artificial intelligence agent register
    statement: 'An AI agent register contains the following for each AI agent:


      - its unique identifier

      - its owner and business purpose

      - the identities assigned to it

      - any user accounts and credentials it uses

      - the tools, permissions and data repositories it can access.'
  ISM-2136:
    guideline: Identity and access management
    section: Authenticating to systems
    statement: Risk-based access decisions, informed by contextual signals, are enforced for access to systems and their resources.
  ISM-2137:
    guideline: Identity and access management
    section: Third-party application access and device code authentication
    statement: Human users are prevented from granting consent to third-party OAuth applications, with such consent granted
      only by an authorised administrator.
  ISM-2138:
    guideline: Identity and access management
    section: Third-party application access and device code authentication
    statement: OAuth application consents, including their granted permissions, are reviewed at least every six months, with
      unused applications and excessive permissions revoked.
  ISM-2139:
    guideline: Identity and access management
    section: Third-party application access and device code authentication
    statement: Consent grants, token issuance and token use for third-party OAuth applications are centrally logged.
  ISM-2140:
    guideline: Identity and access management
    section: Third-party application access and device code authentication
    statement: The OAuth device code authentication flow is disabled unless required, and where required, is restricted to
      authorised user accounts and managed devices.
  ISM-2141:
    guideline: Credential management
    section: Application and workload credentials
    statement: Applications and workloads use short-lived dynamically issued credentials in preference to long-lived static
      credentials.
  ISM-2142:
    guideline: Credential management
    section: Application and workload credentials
    statement: Static credentials used by applications and workloads are centrally managed using a credential or secrets management
      solution.
  ISM-2143:
    guideline: Credential management
    section: Application and workload credentials
    statement: Applications and workloads use unique credentials that are not shared with other applications or workloads,
      or across development, testing, staging and production environments.
  ISM-2144:
    guideline: Credential management
    section: Changing credentials
    statement: 'Static credentials used by applications and workloads are changed if:


      - they are compromised or suspected of being compromised

      - they are discovered stored on systems in the clear

      - they are discovered being transferred across networks in the clear.'
  ISM-2145:
    guideline: Credential management
    section: Revoking credentials
    statement: Credentials for user accounts are revoked when they are no longer required.
  ISM-2146:
    guideline: Credential management
    section: Revoking credentials
    statement: Static credentials used by applications and workloads are revoked when they are no longer required.
  ISM-2147:
    guideline: Credential management
    section: Protecting authentication artefacts
    statement: Authentication tokens, session cookies and refresh tokens are cryptographically bound to the device on which
      they were issued.
  ISM-2148:
    guideline: Credential management
    section: Protecting authentication artefacts
    statement: Active sessions, refresh tokens and other authentication artefacts are revoked when credentials are reset or
      re-enrolled, when credentials are compromised or suspected of being compromised, when a device no longer meets compliance
      requirements, or when high-risk sign-in activity is detected.
  ISM-2149:
    guideline: System administration
    section: Administrative tools
    statement: A list of authorised RMM tools and remote access tools is developed, enforced and maintained.
  ISM-2150:
    guideline: System administration
    section: Administrative tools
    statement: Network connections for unauthorised RMM tools and remote access tools are blocked at gateways.
  ISM-2151:
    guideline: Data backup and restoration
    section: Backup modification and deletion
    statement: Backups are stored using a technically enforced immutability mechanism that prevents their modification or
      deletion for the duration of their retention period.
  ISM-2152:
    guideline: Data backup and restoration
    section: Backup modification and deletion
    statement: Backup infrastructure, including backup servers, repositories and management consoles, is segregated from production
      environments and uses a separate authentication mechanism for administrative access.
  ISM-2153:
    guideline: Security monitoring
    section: Threat hunting
    statement: Threat hunting activities, informed by current strategic and sector-specific cyber threat intelligence, are
      conducted at least every three months.
  ISM-2154:
    guideline: Software development fundamentals
    section: Software artefacts
    statement: Software artefact dependencies are pinned to approved versions in source code.
  ISM-2155:
    guideline: Software development fundamentals
    section: Build solution
    statement: Software is built using reproducible build practices that enable independent verification that release artefacts
      were produced from the stated source code.
  ISM-2156:
    guideline: Artificial intelligence application development
    section: Excessive agency
    statement: Agentic AI applications are restricted to the minimum set of tools, functions and permissions required for
      their intended purpose.
  ISM-2157:
    guideline: Artificial intelligence application development
    section: Excessive agency
    statement: Tools invoked by agentic AI applications are subject to both the access controls of the invoking user and agent-specific,
      task-scoped authorisation, with effective permissions limited to the minimum permitted by both.
  ISM-2158:
    guideline: Artificial intelligence application development
    section: Excessive agency
    statement: External content retrieved by agentic AI applications is treated as untrusted data throughout processing, is
      clearly delimited from system instructions, is subject to validation and sanitisation measures applied to other untrusted
      input, remains untrusted following such processing, and is prevented from modifying or overriding system instructions,
      security policies, access controls, tool permissions or human approval requirements.
  ISM-2159:
    guideline: Artificial intelligence application development
    section: Excessive agency
    statement: All tool invocations, external requests and outputs generated by agentic AI applications are centrally logged
      with sufficient detail to support cyber security incident investigations.
  ISM-2160:
    guideline: Network design and configuration
    section: Networked management interfaces
    statement: Networked management interfaces for IT equipment are only accessible from a dedicated management network that
      is segregated from the wider network and the internet.
  ISM-2161:
    guideline: Network design and configuration
    section: Network device integrity
    statement: The integrity of network device firmware and running configurations is verified against an approved known-good
      baseline following patching, on detection of anomalous behaviour and at least monthly.
  ISM-2162:
    guideline: Network design and configuration
    section: Network device hardening
    statement: Unneeded components, services and functionality of network devices are disabled or removed.
  ISM-2163:
    guideline: Wired networks
    section: Media Access Control Security
    statement: When using MACsec, confidentiality protection mode is enabled using GCM-AES-128, GCM-AES-256, GCM-AES-XPN-128
      or GCM-AES-XPN-256, preferably GCM-AES-256 or GCM-AES-XPN-256.
  ISM-2164:
    guideline: Wired networks
    section: Media Access Control Security
    statement: A connectivity association lifetime of less than 24 hours (86400 seconds) is used for MACsec connections.
  ISM-2165:
    guideline: Wired networks
    section: Media Access Control Security
    statement: When using EAP-TLS, each device performs a fresh EAP-TLS authentication each time a new Connectivity Association
      Key is required.
  ISM-2166:
    guideline: Wired networks
    section: Media Access Control Security
    statement: A secure association lifetime of less than four hours (14400 seconds) is used for MACsec connections.
  ISM-2167:
    guideline: Wired networks
    section: Media Access Control Security
    statement: The use of a Pre-Shared Key as a fallback authentication method for MACsec is disabled.
